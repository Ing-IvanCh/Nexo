async function saveCostos(){
  const num = id=>{ const el = document.getElementById(id); return el && el.value.trim()!=="" ? Number(el.value) : null; };
  const cfg = { factor:num("cf_factor"), horasMes:num("cf_horas"), recargoDominical:num("cf_recargo"), valorBono:num("cf_bono") ?? 0 };
  if(!(cfg.factor >= 1)){ showMsg("El factor prestacional debe ser 1 o mayor.", "bad"); return; }
  if(!(cfg.horasMes > 0)){ showMsg("Las horas laborales al mes deben ser mayores que cero.", "bad"); return; }
  if(cfg.recargoDominical==null || cfg.recargoDominical < 0 || cfg.valorBono < 0){ showMsg("Revisa el recargo y el valor del bono.", "bad"); return; }
  const sal = [...document.querySelectorAll(".sal_input")].map(el=>({ eng:el.dataset.eng, v: el.value.trim()==="" ? null : Number(el.value) }));
  if(sal.some(x=>x.v!=null && (isNaN(x.v) || x.v < 0))){ showMsg("Revisa los salarios: deben ser números positivos.", "bad"); return; }
  try{
    await db.doc("costos/config").set({ ...cfg, updatedAt:new Date().toISOString() });
    await Promise.all(sal.map(x=>db.doc("costos/ing_"+slugify(x.eng)).set({ engineer:x.eng, salario:x.v, updatedAt:new Date().toISOString() })));
    showMsg("Costos guardados.", "ok");
  }catch(err){ showMsg("No se pudieron guardar (¿actualizaste las reglas de Firestore?): " + (err.message||err.code), "bad"); }
}

// Costos del mes para el informe: mano de obra por código (y no facturable), bonos y gastos del mes.
function costosDelMes(r){
  if(!hayCostos()) return null;
  const regs = allEntries.filter(d=>!AUSENCIA_TYPES.includes(d.tipoHora||"Normal"));
  const porCod = {};
  regs.forEach(d=>{
    const cat = proyectoCategoria(d.proyecto);
    const k = ["Proyecto","Servicio","Capacitación"].includes(cat) ? codigoProyecto(d.proyecto) : "__interno";
    (porCod[k] || (porCod[k] = { regs:[], cat })).regs.push(d);
  });
  const bonos = bonoPorCodigo(r.start, r.end);
  const gasMes = gastos.filter(g=>g.fecha >= r.start && g.fecha <= r.end);
  const filas = {};
  const fila = (k, cat)=> filas[k] || (filas[k] = { codigo:k, cat, mo:0, recargo:0, bono:0, gastos:0, sinCosto:0 });
  Object.entries(porCod).forEach(([k,v])=>{ const c = costoRegistros(v.regs); const f = fila(k, v.cat); f.mo += c.normal + c.extra; f.recargo += c.recargo; f.sinCosto += c.horasSinCosto; });
  Object.entries(bonos).forEach(([k,v])=>{ fila(k, proyectoCategoria(k)).bono += v; });
  gasMes.forEach(g=>{ const k = String(g.codigo||"").trim() || "__interno"; fila(k, proyectoCategoria(k)).gastos += Number(g.valor)||0; });
  const lista = Object.values(filas).map(f=>{
    const pr = projectsList.find(x=>String(x.codigo||"").trim()===f.codigo);
    f.nombre = f.codigo==="__interno" ? "Apoyo interno / sin código (no facturable)" : (pr ? projectOptionLabel(pr) : f.codigo);
    f.total = f.mo + f.recargo + f.bono + f.gastos;
    return f;
  }).sort((a,b)=> (a.codigo==="__interno") - (b.codigo==="__interno") || b.total - a.total);
  const tot = k => lista.reduce((a,f)=>a+f[k],0);
  const sinSalario = [...new Set(regs.filter(d=>costoHora(d.engineer)==null).map(d=>d.engineer))];
  return { lista, mo:tot("mo"), recargo:tot("recargo"), bono:tot("bono"), gastos:tot("gastos"), total:tot("total"),
    noFacturable: lista.filter(f=>f.codigo==="__interno" || f.cat==="Capacitación").reduce((a,f)=>a+f.total,0), sinSalario };
}

// Lee los campos del formulario del proyecto.
function leerProjForm(){
  const v = id=>{ const el=document.getElementById(id); return el ? el.value.trim() : ""; };
  return { tipo:v("pf_tipo"), codigo:v("pf_codigo"), cliente:v("pf_cliente"), anio: v("pf_anio") ? Number(v("pf_anio")) : null,
    nombre:v("pf_nombre"), objeto:v("pf_objeto"), docTipo:v("pf_doctipo"), documento:v("pf_documento"),
    estado:v("pf_estado"), fechaInicio:v("pf_inicio"), fechaFin:v("pf_fin"), notas:v("pf_notas"),
    presupuestoValor: v("pf_pres") ? Number(v("pf_pres")) : null, presupuestoUnidad: v("pf_pres_u") || "h" };
}
// Crea un proyecto nuevo o guarda los cambios de uno existente en config_projects.
async function saveProject(){
  const isNew = projSel==="__new__";
  const f = leerProjForm();
  if(!f.nombre){ showMsg("Escribe el nombre corto del proyecto.", "bad"); return; }
  if(f.presupuestoValor!=null && (isNaN(f.presupuestoValor) || f.presupuestoValor < 0)){ showMsg("El presupuesto debe ser un número positivo.", "bad"); return; }
  if(f.fechaInicio && f.fechaFin && f.fechaFin < f.fechaInicio){ showMsg("La fecha de fin no puede ser antes de la de inicio.", "bad"); return; }
  try{
    if(isNew){
      if(!f.codigo){ showMsg("El número del proyecto no puede quedar vacío.", "bad"); return; }
      const id = sanitizeId(f.codigo);
      // No permite crear dos proyectos con el mismo número.
      if(projectsList.some(p=>p.id===id)){ showMsg(`El número ${f.codigo} ya existe. Usa otro.`, "bad"); return; }
      await db.doc("config_projects/"+id).set({ ...f, ordenes:[], createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() });
      projSel = id; projFiltroEstado = "todos";
      showMsg(`Proyecto ${f.codigo} creado.`, "ok");
      loadProjHoras({ id, codigo:f.codigo });
    } else {
      const p = projectsList.find(x=>x.id===projSel); if(!p) return;
      const { id, ...resto } = p;
      delete f.tipo; delete f.codigo; // el tipo y el número no cambian una vez creado
      await db.doc("config_projects/"+p.id).set({ ...resto, ...f, updatedAt:new Date().toISOString() });
      showMsg("Cambios guardados.", "ok");
    }
  }catch(err){ showMsg("No se pudo guardar: " + (err.message||err.code), "bad"); }
}
// Elimina un proyecto de la lista (las horas registradas no se borran).
async function deleteProject(id){
  pendingConfirm = null;
  try{ await db.doc("config_projects/"+id).delete(); projSel = ""; showMsg("Proyecto eliminado. Las horas registradas no se borraron.", "ok"); }
  catch(err){ showMsg("No se pudo eliminar: " + (err.message||err.code), "bad"); render(); }
}
// Guarda la lista completa de órdenes dentro del documento del proyecto.
async function saveOrdenes(projId, ordenes, msg){
  try{ await db.doc("config_projects/"+projId).update({ ordenes, updatedAt:new Date().toISOString() }); if(msg) showMsg(msg, "ok"); }
  catch(err){ showMsg("No se pudo guardar la orden: " + (err.message||err.code), "bad"); render(); }
}
// Agrega una orden nueva al contrato o guarda la que se está editando.
async function saveOrden(projId){
  const p = projectsList.find(x=>x.id===projId); if(!p) return;
  const v = id=>{ const el=document.getElementById(id); return el ? el.value.trim() : ""; };
  const o = { numero:v("of_numero"), fecha:v("of_fecha"), dias: v("of_dias")==="" ? null : Number(v("of_dias")), fechaProgramada:v("of_programada"),
    descripcion:v("of_descripcion"), estado:v("of_estado") || "Solicitada", nota:v("of_nota") };
  if(!o.numero && !o.descripcion){ showMsg("Escribe al menos el número de la OC/OS o una descripción.", "bad"); return; }
  const ordenes = (p.ordenes||[]).slice();
  const editId = editingOrden && editingOrden.proj===projId ? editingOrden.id : null;
  if(editId){
    const i = ordenes.findIndex(x=>x.id===editId);
    if(i>=0) ordenes[i] = { ...ordenes[i], ...o };
  } else {
    ordenes.push({ id: "o"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), ...o, createdAt:new Date().toISOString() });
  }
  editingOrden = null;
  await saveOrdenes(projId, ordenes, editId ? "Orden actualizada." : "Orden agregada.");
}
// Cambia el estado de una orden desde el desplegable de la tabla.
async function updateOrdenEstado(projId, ordenId, estado){
  const p = projectsList.find(x=>x.id===projId); if(!p) return;
  const ordenes = (p.ordenes||[]).map(o=> o.id===ordenId ? { ...o, estado } : o);
  await saveOrdenes(projId, ordenes, `Orden en estado "${estado}".`);
}
// Elimina una orden del contrato.
async function deleteOrden(projId, ordenId){
  pendingConfirm = null;
  const p = projectsList.find(x=>x.id===projId); if(!p) return;
  if(editingOrden && editingOrden.id===ordenId) editingOrden = null;
  await saveOrdenes(projId, (p.ordenes||[]).filter(o=>o.id!==ordenId), "Orden eliminada.");
}



// ---------- Compensatorios y Bonos de campo (dos pestañas, solo admin) ----------
// Reglas acordadas:
//  COMPENSATORIOS (en horas; 1 día = 8.5 h)
//   · Toda hora Extra suma a compensatorio, salvo domingos/festivos que se pagan en dinero.
//   · Domingo/festivo (trabajo normal) = pago en dinero por defecto; el admin puede pasarlo a compensatorio.
//   · Movilización a campo SIEMPRE se compensa, aunque sea domingo o festivo.
//   · Se descuenta solo cada registro con tipo de hora "Compensatorio".
//  BONOS DE CAMPO (en días)
//   · 1 día por cada fecha con "Servicio (en campo)" y horas > 0 (sábados y domingos incluidos).
//   · No suman: el día de viaje (movilización) ni el domingo/festivo que se paga en dinero.
//  PUNTO DE PARTIDA: la app cuenta desde SALDO_CORTE; lo anterior es el saldo del Excel.
// Desde esta fecha cuenta la app; lo anterior es el saldo histórico del control anterior.
const SALDO_CORTE = "2026-10-01";
const SALDO_VERSION = 2;
// Redondea a 2 decimales y devuelve texto (7.1834 -> '7.18').
function fmtN(n){ return String(Math.round((Number(n)||0)*100)/100); }
// Compensatorios: los días son la unidad principal (1 d = 8.5 h) y las horas van de secundario
// Convierte horas a días de jornada (horas / 8.5).
function hToD(h){ return (Number(h)||0)/MAX_HORAS; }
// Texto en días: '7.18 d'.
function fmtD(h){ return `${fmtN(hToD(h))} d`; }
// Texto en días y horas: '7.18 d (61 h)'.
function fmtDH(h){ return `${fmtN(hToD(h))} d (${fmtN(h)} h)`; }
// Días en grande y horas en pequeño para las tablas, con signo opcional (+/−).
function dhHtml(h, signo){ return `${signo||""}${fmtN(hToD(h))} d <span class="hint">(${fmtN(h)} h)</span>`; }
const SALDO_HIST_LABEL = "Saldo histórico";
const SALDO_HIST_FECHA = "30-sep-2026"; // último día antes de SALDO_CORTE
// Escapa caracteres especiales para mostrar texto seguro dentro del HTML.
function escH(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
// Id del documento de pago de un día de campo: '<ingeniero>_<fecha>'.
function campoPagoId(engineer, fecha){ return sanitizeId(engineer) + "_" + fecha; }
// true si la hora extra es de movilización a campo.
function esMovilizacion(d){ return d.extraTipo === "Movilización a campo"; }
// true si la hora extra puede pagarse en dinero (domingo/festivo que no sea movilización).
function puedeElegirPago(d){ return d.tipoHora==="Extra" && !esMovilizacion(d) && esDominical(d.fecha); }
// Cómo se reconoce una hora extra: 'Pago' (dinero) o 'Tiempo' (compensatorio).
// Por defecto: domingo/festivo = Pago; lo demás = Tiempo; el admin puede cambiar los domingos.
function tratamientoDe(d){
  if(!puedeElegirPago(d)) return "Tiempo";           // entre semana, sábado y movilización: siempre compensatorio
  const a = compAjustes[d._id];
  return (a && a.tratamiento) || "Pago";             // domingo/festivo: pago por defecto
}
// Mes en que queda registrado un pago: el mes seleccionado arriba, pero nunca antes del mes del propio registro
// Mes en que queda registrado un pago: el mes seleccionado, pero nunca antes del mes del propio registro.
function mesPagoPara(fecha){ const m = (fecha||"").slice(0,7); return m > selectedMonth ? m : selectedMonth; }
// Saldo histórico de un ingeniero: el corregido por el admin (comp_saldos) o, si no hay, el del control anterior.
function saldoDe(name){
  const saved = compSaldos[slugify(name)];
  if(saved && saved.v === SALDO_VERSION) return saved;
  const ref = excelRef(name);
  return ref
    ? { v:SALDO_VERSION, compHoras:ref.compHoras, domHoras:ref.domHoras, bonoDias:ref.bonoDias, domSaldoMesPago:"", bonoSaldoMesPago:"", _auto:true }
    : { v:SALDO_VERSION, compHoras:0, domHoras:0, bonoDias:0, domSaldoMesPago:"", bonoSaldoMesPago:"", _auto:true, _sinExcel:true };
}

// Calcula para cada ingeniero, desde SALDO_CORTE: horas a compensatorio, compensatorios tomados,
// domingos por pagar, días de campo (pagados y pendientes) y los totales de cada tarjeta.
function computeCompBonos(){
  const names = new Set(engineerNames());
  const res = {};
  names.forEach(n=>{
    res[n] = { name:n, saldo:saldoDe(n), pago:[], tiempo:[], tomados:[], dias:[], noSuman:[] };
  });
  const enRango = d => d.fecha && d.fecha >= SALDO_CORTE;
  const diasPagados = new Set(); // ingeniero|fecha de domingos/festivos pagados en dinero (no suman bono)
  compEntries.forEach(d=>{
    const r = res[d.engineer]; if(!r || !enRango(d)) return;
    const h = Number(d.horas)||0;
    if(d.tipoHora === "Extra"){
      const tratamiento = tratamientoDe(d);
      if(tratamiento === "Pago"){
        const aj = compAjustes[d._id] || {};
        r.pago.push({ ...d, h, pagado: !!aj.pagado, mesPago: aj.mesPago||"" });
        diasPagados.add(d.engineer+"|"+d.fecha);
      } else {
        r.tiempo.push({ ...d, h });
      }
    } else if(d.tipoHora === "Compensatorio"){
      r.tomados.push({ ...d, h });
    }
  });
  // Un día de campo = una fecha distinta con 'Servicio (en campo)' y horas > 0 (sin contar el viaje).
  const dias = {};
  campoEntries.forEach(d=>{
    const r = res[d.engineer]; if(!r || !enRango(d)) return;
    if(!((Number(d.horas)||0) > 0)) return;
    if(d.tipoHora === "Extra" && esMovilizacion(d)) return; // el viaje no suma bono
    const k = d.engineer+"|"+d.fecha;
    if(!dias[k]) dias[k] = { engineer:d.engineer, fecha:d.fecha, horas:0, proyectos:new Set() };
    dias[k].horas += Number(d.horas)||0;
    if(d.proyecto) dias[k].proyectos.add(d.proyecto);
  });
  Object.entries(dias).forEach(([k,x])=>{
    x.proyecto = [...x.proyectos].join(", ");
    const r = res[x.engineer];
    if(esDominical(x.fecha) && diasPagados.has(k)){ r.noSuman.push(x); return; }
    const p = campoPagos[campoPagoId(x.engineer, x.fecha)];
    x.pagado = !!(p && p.pagado); x.mesPago = (p && p.mesPago) || "";
    r.dias.push(x);
  });
  const desc = (a,b)=> (b.fecha||"").localeCompare(a.fecha||"");
  Object.values(res).forEach(r=>{
    [r.pago, r.tiempo, r.tomados, r.dias, r.noSuman].forEach(l=>l.sort(desc));
    const s = r.saldo;
    r.compSaldoH = Number(s.compHoras)||0;
    r.compGenH = r.tiempo.reduce((a,d)=>a+d.h,0);
    r.compTomH = r.tomados.reduce((a,d)=>a+d.h,0);
    // Compensatorio pendiente = saldo histórico + generado − tomado (en horas).
    r.compPendH = r.compSaldoH + r.compGenH - r.compTomH;
    r.domSaldoH = Number(s.domHoras)||0;
    r.domPendH = (s.domSaldoMesPago ? 0 : r.domSaldoH) + r.pago.filter(d=>!d.pagado).reduce((a,d)=>a+d.h,0);
    r.bonoSaldo = Number(s.bonoDias)||0;
    // Bono pendiente = saldo histórico sin pagar + días de campo sin pagar.
    r.bonoPend = (s.bonoSaldoMesPago ? 0 : r.bonoSaldo) + r.dias.filter(x=>!x.pagado).length;
    r.bonoPag = (s.bonoSaldoMesPago ? r.bonoSaldo : 0) + r.dias.filter(x=>x.pagado).length;
  });
  return res;
}
// Ordena los ingenieros igual que en la pestaña Equipo.
function cbList(res){
  const order = engineerNames();
  return Object.values(res).sort((a,b)=> order.indexOf(a.name) - order.indexOf(b.name));
}

// Sección plegable (se abre/cierra al tocar el título) que recuerda si estaba abierta.
function cbFold(key, title, inner){
  return `<details class="cbfold" data-fold="${key}" ${openFolds.has(key)?"open":""}><summary>${title}</summary><div class="cbfold-body">${inner}</div></details>`;
}
// Tabla con encabezados dentro de un contenedor que en celular se ve como tarjetas.
function cbTable(headers, rows){
  return `<div class="scroll-x"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
// Encabezado común de Compensatorios y Bonos: aviso del mes de pago (el informe se descarga en la pestaña Informes).
function cbTop(){
  const antesDeCorte = selectedMonth < SALDO_CORTE.slice(0,7);
  return `${antesDeCorte ? `<div class="msg bad" style="display:block">El control empieza el ${SALDO_CORTE}. Elige octubre 2026 o un mes posterior arriba.</div>` : ""}
    <div class="hint" style="margin:-4px 0 12px">Lo que marques como pagado queda registrado en el mes seleccionado arriba: <b>${monthLabel(selectedMonth)}</b>.</div>`;
}
// Texto que explica de dónde viene el saldo histórico del ingeniero.
function cbExcelHint(r, kind){
  const ref = excelRef(r.name);
  if(!ref) return `Sin saldo histórico cargado para este ingeniero.`;
  if(!r.saldo._auto) return `Saldo histórico <b>corregido manualmente</b>.`;
  const v = kind==="comp" ? `compensatorio ${fmtDH(ref.compHoras)} · domingos por pagar ${fmtDH(ref.domHoras)}` : `${ref.bonoDias} días de bono pendientes`;
  return `Valores cargados del control anterior: ${v}.`;
}

// Detalle de compensatorios de un ingeniero: resumen, domingos por pagar, movimientos y saldo histórico.
function renderCompDetalle(r){
  const s = r.saldo;
  const k = slugify(r.name);
  // 1) Por pagar en dinero (pendientes)
  const pendPago = r.pago.filter(d=>!d.pagado);
  const excelDomPend = r.domSaldoH>0 && !s.domSaldoMesPago;
  const pagoRows = (excelDomPend ? `<tr>
      <td data-label="Fecha">Al ${SALDO_HIST_FECHA}</td><td data-label="Día">—</td><td data-label="Detalle">${SALDO_HIST_LABEL}</td>
      <td data-label="Días">${dhHtml(r.domSaldoH)}</td>
      <td data-label=""><button class="tiny ok" data-act="cb-saldo-pago" data-eng="${escH(r.name)}" data-kind="dom">Marcar pagado</button></td></tr>` : "")
    + pendPago.map(d=>`<tr>
      <td data-label="Fecha">${d.fecha}</td><td data-label="Día">${diaLabel(d.fecha)}</td>
      <td data-label="Detalle">${escH(d.detalle||d.actividad||"")}${d.proyecto?`<div class="hint">${escH(d.proyecto)}</div>`:""}</td>
      <td data-label="Días">${dhHtml(d.h)}</td>
      <td data-label=""><button class="tiny ok" data-act="cb-dom-pago" data-id="${d._id}">Marcar pagado</button> <button class="tiny" data-act="cb-trat" data-id="${d._id}" data-v="Tiempo">Pasar a compensatorio</button></td></tr>`).join("");
  // 2) Movimientos de compensatorio: mes seleccionado arriba, anteriores plegados
  const movs = r.tiempo.map(d=>({ ...d, signo:+1, concepto: esMovilizacion(d) ? "Extra · movilización" : (esDominical(d.fecha) ? "Extra · domingo/festivo (compensado)" : "Extra · trabajo") }))
    .concat(r.tomados.map(d=>({ ...d, signo:-1, concepto: "Compensatorio tomado" + (d.obs ? " · "+d.obs : "") })))
    .sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||""));
  const movRow = d=>`<tr>
      <td data-label="Fecha">${d.fecha}</td><td data-label="Día">${diaLabel(d.fecha)}</td>
      <td data-label="Concepto">${escH(d.concepto)}</td>
      <td data-label="Días" style="font-weight:600;color:${d.signo>0?"var(--ok)":"var(--bad)"}">${dhHtml(d.h, d.signo>0?"+":"−")}</td>
      <td data-label="">${d.signo>0 && puedeElegirPago(d) ? `<button class="tiny" data-act="cb-trat" data-id="${d._id}" data-v="Pago">Pasar a pago en dinero</button>` : ""}</td></tr>`;
  const movMes = movs.filter(d=>d.fecha.slice(0,7)===selectedMonth);
  const movOtros = movs.filter(d=>d.fecha.slice(0,7)!==selectedMonth);
  // 3) Ya pagados en dinero (plegado)
  const pagados = r.pago.filter(d=>d.pagado);
  const pagadosRows = (r.domSaldoH>0 && s.domSaldoMesPago ? `<tr>
      <td data-label="Fecha">Al ${SALDO_HIST_FECHA}</td><td data-label="Detalle">${SALDO_HIST_LABEL}</td><td data-label="Días">${dhHtml(r.domSaldoH)}</td>
      <td data-label="Mes de pago">${monthLabel(s.domSaldoMesPago)}</td>
      <td data-label=""><button class="tiny" data-act="cb-saldo-pago" data-eng="${escH(r.name)}" data-kind="dom">Desmarcar</button></td></tr>` : "")
    + pagados.map(d=>`<tr>
      <td data-label="Fecha">${d.fecha} · ${diaLabel(d.fecha)}</td><td data-label="Detalle">${escH(d.detalle||d.actividad||"")}</td><td data-label="Días">${dhHtml(d.h)}</td>
      <td data-label="Mes de pago">${d.mesPago?monthLabel(d.mesPago):"—"}</td>
      <td data-label=""><button class="tiny" data-act="cb-dom-pago" data-id="${d._id}">Desmarcar</button></td></tr>`).join("");
  const nPagados = pagados.length + (r.domSaldoH>0 && s.domSaldoMesPago ? 1 : 0);

  return `
  <div class="card" id="cb_detalle">
    <div class="cbhead"><h3 style="margin:0">${escH(r.name)} · Compensatorios</h3><button class="tiny" data-act="cb-open" data-tab="comp" data-eng="${escH(r.name)}">Cerrar</button></div>
    <div class="kpis">
      <div class="kpi"><div class="kpi-l">${SALDO_HIST_LABEL}</div><div class="kpi-v">${dhHtml(r.compSaldoH)}</div></div>
      <div class="kpi"><div class="kpi-l">Generado</div><div class="kpi-v" style="color:var(--ok)">${dhHtml(r.compGenH,"+")}</div></div>
      <div class="kpi"><div class="kpi-l">Tomado</div><div class="kpi-v" style="color:var(--bad)">${dhHtml(r.compTomH,"−")}</div></div>
      <div class="kpi"><div class="kpi-l">Pendiente</div><div class="kpi-v">${dhHtml(r.compPendH)}</div></div>
    </div>

    <h4 class="cbh">Domingos y festivos por pagar en dinero (${fmtDH(r.domPendH)})</h4>
    ${pagoRows ? cbTable(["Fecha","Día","Detalle","Días",""], pagoRows) : `<div class="empty">Nada pendiente por pagar.</div>`}

    <h4 class="cbh">Movimientos de compensatorio · ${monthLabel(selectedMonth)}</h4>
    ${movMes.length ? cbTable(["Fecha","Día","Concepto","Días",""], movMes.map(movRow).join("")) : `<div class="empty">Sin movimientos en este mes.</div>`}
    ${movOtros.length ? cbFold("comp-otros-"+k, `Movimientos de otros meses (${movOtros.length})`, cbTable(["Fecha","Día","Concepto","Días",""], movOtros.map(movRow).join(""))) : ""}
    ${nPagados ? cbFold("comp-pagados-"+k, `Ya pagados en dinero (${nPagados})`, cbTable(["Fecha","Detalle","Días","Mes de pago",""], pagadosRows)) : ""}

    ${cbFold("comp-saldo-"+k, `${SALDO_HIST_LABEL} (corregir)`, `
      <div class="hint" style="margin-bottom:8px">${cbExcelHint(r,"comp")} Es lo que traía cada ingeniero al ${SALDO_HIST_FECHA}. Escríbelo en <b>días</b> (1 día = ${MAX_HORAS} h).</div>
      <div class="row2">
        <div><label>Compensatorio pendiente (días)</label><input type="number" step="any" id="saldo_comp_d" value="${Math.round(hToD(s.compHoras)*10000)/10000}"></div>
        <div><label>Domingos/festivos por pagar (días)</label><input type="number" step="any" id="saldo_dom_d" value="${Math.round(hToD(s.domHoras)*10000)/10000}"></div>
      </div>
      <button class="primary" data-act="cb-save-saldo" data-eng="${escH(r.name)}" data-kind="comp">Guardar saldo</button>`)}
  </div>`;
}

// Guarda si una hora extra de domingo/festivo se paga en dinero o se compensa (comp_ajustes).
async function cbSaveTratamiento(id, tratamiento){
  const d = compEntries.find(e=>e._id===id); if(!d) return;
  const data = { tratamiento, pagado:false, mesPago:"", engineer:d.engineer, fecha:d.fecha, updatedAt:new Date().toISOString() };
  try{ await db.doc("comp_ajustes/"+id).set(data); showMsg(tratamiento==="Pago" ? "Pasado a pago en dinero." : "Pasado a compensatorio.", "ok"); }
  catch(err){ showMsg(CB_ERR + (err.message||err.code), "bad"); render(); }
}
// Marca o desmarca como pagado en dinero un domingo/festivo.
async function cbToggleDomPago(id){
  const d = compEntries.find(e=>e._id===id); if(!d) return;
  const cur = compAjustes[id] || {};
  const pagado = !cur.pagado;
  const data = { tratamiento:"Pago", pagado, mesPago: pagado ? mesPagoPara(d.fecha) : "", engineer:d.engineer, fecha:d.fecha, updatedAt:new Date().toISOString() };
  try{ await db.doc("comp_ajustes/"+id).set(data); showMsg(pagado ? `Marcado como pagado en ${monthLabel(data.mesPago)}.` : "Vuelve a pendiente.", "ok"); }
  catch(err){ showMsg(CB_ERR + (err.message||err.code), "bad"); render(); }
}
// Marca o desmarca como pagado un día de bono de campo (campo_pagos).
async function cbToggleBono(engineer, fecha){
  const id = campoPagoId(engineer, fecha);
  const cur = campoPagos[id];
  try{
    if(cur && cur.pagado){ await db.doc("campo_pagos/"+id).delete(); showMsg("Día de campo vuelve a pendiente.", "ok"); }
    else {
      const mesPago = mesPagoPara(fecha);
      await db.doc("campo_pagos/"+id).set({ engineer, fecha, pagado:true, mesPago, updatedAt:new Date().toISOString() });
      showMsg(`Día de campo marcado como pagado en ${monthLabel(mesPago)}.`, "ok");
    }
  }catch(err){ showMsg(CB_ERR + (err.message||err.code), "bad"); render(); }
}
// Guarda el saldo histórico de un ingeniero en comp_saldos.
async function cbWriteSaldo(engineer, patch){
  const base = { ...saldoDe(engineer) };
  delete base._auto; delete base._sinExcel;
  const data = { ...base, ...patch, v:SALDO_VERSION, engineer, updatedAt:new Date().toISOString() };
  await db.doc("comp_saldos/"+slugify(engineer)).set(data);
}
// Marca o desmarca como pagado el saldo histórico de domingos o de bonos.
async function cbToggleSaldoPago(engineer, kind){
  const s = saldoDe(engineer);
  const campo = kind==="dom" ? "domSaldoMesPago" : "bonoSaldoMesPago";
  const mes = s[campo] ? "" : (selectedMonth < SALDO_CORTE.slice(0,7) ? SALDO_CORTE.slice(0,7) : selectedMonth);
  try{ await cbWriteSaldo(engineer, { [campo]: mes }); showMsg(mes ? `Saldo histórico marcado como pagado en ${monthLabel(mes)}.` : "Saldo histórico vuelve a pendiente.", "ok"); }
  catch(err){ showMsg(CB_ERR + (err.message||err.code), "bad"); render(); }
}
// Guarda la corrección del saldo histórico escrita por el admin (compensatorio se escribe en días).
async function cbSaveSaldo(engineer, kind){
  const num = id=>{ const el=document.getElementById(id); const v = el ? el.value.trim() : ""; return v==="" ? 0 : Number(v); };
  // Compensatorio: se escribe en días y se guarda en horas (días × 8.5)
  const patch = kind==="comp" ? { compHoras: num("saldo_comp_d")*MAX_HORAS, domHoras: num("saldo_dom_d")*MAX_HORAS } : { bonoDias: num("saldo_bono_d") };
  if(Object.values(patch).some(v=>isNaN(v))){ showMsg("Revisa los números del saldo.", "bad"); return; }
  try{ await cbWriteSaldo(engineer, patch); showMsg("Saldo histórico guardado.", "ok"); }
  catch(err){ showMsg(CB_ERR + (err.message||err.code), "bad"); }
}

// --- Informe Word de compensatorios y bonos (mismo membrete que el de horas) ---
// Cifras de un ingeniero para un mes: saldo al inicio, generado, tomado/pagado y saldo al cierre.
function cbMonthData(r, ym){
  const {start, end} = monthRange(ym);
  const inMes = f => f>=start && f<=end;
  const s = r.saldo;
  // Compensatorio (h)
  // Compensatorio: saldo al inicio del mes = histórico + generado antes del mes − tomado antes del mes.
  const compIni = r.compSaldoH + r.tiempo.filter(d=>d.fecha<start).reduce((a,d)=>a+d.h,0) - r.tomados.filter(d=>d.fecha<start).reduce((a,d)=>a+d.h,0);
  const compGen = r.tiempo.filter(d=>inMes(d.fecha)).reduce((a,d)=>a+d.h,0);
  const compTom = r.tomados.filter(d=>inMes(d.fecha)).reduce((a,d)=>a+d.h,0);
  // Domingos/festivos por pagar (h): pendiente al inicio = generado antes del mes y no pagado antes del mes
  // Algo estaba pendiente al inicio del mes si se generó antes y no se había pagado antes de ese mes.
  const pendAntes = (fecha, pagado, mesPago) => fecha<start && (!pagado || mesPago>=ym);
  const domIni = (r.domSaldoH>0 && (!s.domSaldoMesPago || s.domSaldoMesPago>=ym) ? r.domSaldoH : 0)
    + r.pago.filter(d=>pendAntes(d.fecha, d.pagado, d.mesPago)).reduce((a,d)=>a+d.h,0);
  const domGen = r.pago.filter(d=>inMes(d.fecha)).reduce((a,d)=>a+d.h,0);
  const domPag = (s.domSaldoMesPago===ym ? r.domSaldoH : 0) + r.pago.filter(d=>d.pagado && d.mesPago===ym).reduce((a,d)=>a+d.h,0);
  // Bono (días)
  const bonoIni = (r.bonoSaldo>0 && (!s.bonoSaldoMesPago || s.bonoSaldoMesPago>=ym) ? r.bonoSaldo : 0)
    + r.dias.filter(x=>pendAntes(x.fecha, x.pagado, x.mesPago)).length;
  const bonoGen = r.dias.filter(x=>inMes(x.fecha)).length;
  const bonoPag = (s.bonoSaldoMesPago===ym ? r.bonoSaldo : 0) + r.dias.filter(x=>x.pagado && x.mesPago===ym).length;
  return { compIni, compGen, compTom, compFin: compIni+compGen-compTom, domIni, domGen, domPag, domFin: domIni+domGen-domPag, bonoIni, bonoGen, bonoPag, bonoFin: bonoIni+bonoGen-bonoPag, inMes };
}

// Genera y descarga el informe Word de compensatorios y bonos del mes.
async function downloadCompBonosReport(){
  if(!downloadsCap){ showMsg("La descarga no está disponible en esta vista.", "bad"); return; }
  if(typeof JSZip === "undefined"){ showMsg("No se pudo cargar el generador de Word. Intenta de nuevo.", "bad"); return; }
  const ym = selectedMonth;
  if(ym < SALDO_CORTE.slice(0,7)){ showMsg(`El control empieza el ${SALDO_CORTE}. Elige octubre 2026 o un mes posterior.`, "bad"); return; }
  const res = computeCompBonos();
  const list = cbList(res);
  const rows = list.map(r=>({ r, m: cbMonthData(r, ym) }));
  let body = "";
  body += wp("INFORME DE COMPENSATORIOS Y BONOS DE CAMPO", {bold:true, color:"1F4E78", size:32, after:40});
  body += wp("Área de Proyectos", {bold:true, color:"6B7280", size:24, after:20});
  body += wp(`Periodo: ${monthLabel(ym)}   ·   Generado: ${new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})}`, {italics:true, color:"6B7280", size:20, after:200});
  body += wp(`Criterios: toda hora extra genera compensatorio, excepto domingos y festivos reconocidos como pago en dinero; la movilización a campo siempre se compensa. Cada día registrado como "Compensatorio" se descuenta del saldo. El bono de campo suma un día por cada fecha laborada en campo (actividad "${ACTIVIDAD_CAMPO}"); no suman los días de viaje ni los domingos o festivos pagados en dinero. Los saldos históricos corresponden al control anterior con corte al ${SALDO_HIST_FECHA}. Los compensatorios se expresan en días (1 día = ${MAX_HORAS} horas) y entre paréntesis en horas.`, {size:18, color:"374151", after:200});

  // 1. Compensatorios
  body += wHeading("1. Compensatorios");
  body += wp("1.1 Saldo de compensatorio por colaborador (días)", {bold:true, size:19, after:80});
  body += wTable(["Colaborador","Saldo al inicio","Generado en el mes","Tomado en el mes","Saldo al cierre"], [2080,2000,2000,2000,2000],
    rows.map(({r,m})=>[r.name, fmtDH(m.compIni), "+"+fmtDH(m.compGen), "−"+fmtDH(m.compTom), fmtDH(m.compFin)]));
  body += wp("1.2 Domingos y festivos por pagar en dinero (días)", {bold:true, size:19, after:80});
  body += wTable(["Colaborador","Pendiente al inicio","Generado en el mes","Pagado en el mes","Pendiente al cierre"], [2480,1900,1900,1900,1900],
    rows.map(({r,m})=>[r.name, fmtDH(m.domIni), "+"+fmtDH(m.domGen), "−"+fmtDH(m.domPag), fmtDH(m.domFin)]));
  const compMovs = [];
  rows.forEach(({r,m})=>{
    r.tiempo.filter(x=>m.inMes(x.fecha)).forEach(x=>compMovs.push([x.fecha, diaLabel(x.fecha), r.name, esMovilizacion(x) ? "Extra · movilización → compensatorio" : "Extra → compensatorio", "+"+fmtDH(x.h)]));
    r.tomados.filter(x=>m.inMes(x.fecha)).forEach(x=>compMovs.push([x.fecha, diaLabel(x.fecha), r.name, "Compensatorio tomado", "−"+fmtDH(x.h)]));
    r.pago.filter(x=>m.inMes(x.fecha)).forEach(x=>compMovs.push([x.fecha, diaLabel(x.fecha), r.name, "Extra domingo/festivo → pago en dinero" + (x.pagado ? ` (pagado ${monthLabel(x.mesPago)})` : " (pendiente)"), fmtDH(x.h)]));
    r.pago.filter(x=>x.pagado && x.mesPago===ym && !m.inMes(x.fecha)).forEach(x=>compMovs.push([x.fecha, diaLabel(x.fecha), r.name, "Pago en dinero de domingo/festivo anterior", fmtDH(x.h)]));
    if(r.saldo.domSaldoMesPago===ym && r.domSaldoH>0) compMovs.push(["—", "—", r.name, "Pago de domingos del saldo histórico", fmtDH(r.domSaldoH)]);
  });
  compMovs.sort((a,b)=> a[2].localeCompare(b[2]) || a[0].localeCompare(b[0]));
  body += wp("1.3 Detalle de movimientos del mes", {bold:true, size:19, after:80});
  body += compMovs.length ? wTable(["Fecha","Día","Colaborador","Concepto","Días"], [1300,1100,1800,4080,1800], compMovs)
    : wp("Sin movimientos de compensatorio en el periodo.", {italics:true, color:"6B7280"});

  // 2. Bonos de campo
  body += wHeading("2. Bonos de campo");
  body += wp("2.1 Días de bono de campo por colaborador", {bold:true, size:19, after:80});
  body += wTable(["Colaborador","Pendiente al inicio","Días en campo del mes","Pagados en el mes","Pendiente al cierre"], [2480,1900,1900,1900,1900],
    rows.map(({r,m})=>[r.name, fmtN(m.bonoIni)+" d", "+"+m.bonoGen+" d", "−"+fmtN(m.bonoPag)+" d", fmtN(m.bonoFin)+" d"]));
  const bonoMovs = [];
  rows.forEach(({r,m})=>{
    r.dias.filter(x=>m.inMes(x.fecha)).forEach(x=>bonoMovs.push([x.fecha, diaLabel(x.fecha), r.name, x.proyecto||"—", x.pagado ? `Pagado (${monthLabel(x.mesPago)})` : "Pendiente"]));
    r.dias.filter(x=>x.pagado && x.mesPago===ym && !m.inMes(x.fecha)).forEach(x=>bonoMovs.push([x.fecha, diaLabel(x.fecha), r.name, x.proyecto||"—", "Pago en este mes (día de un mes anterior)"]));
    r.noSuman.filter(x=>m.inMes(x.fecha)).forEach(x=>bonoMovs.push([x.fecha, diaLabel(x.fecha), r.name, x.proyecto||"—", "No suma: domingo/festivo pagado en dinero"]));
    if(r.saldo.bonoSaldoMesPago===ym && r.bonoSaldo>0) bonoMovs.push(["—", "—", r.name, "Saldo histórico", `Pago de ${fmtN(r.bonoSaldo)} días`]);
  });
  bonoMovs.sort((a,b)=> a[2].localeCompare(b[2]) || a[0].localeCompare(b[0]));
  body += wp("2.2 Detalle de días en campo y pagos del mes", {bold:true, size:19, after:80});
  body += bonoMovs.length ? wTable(["Fecha","Día","Colaborador","Proyecto","Estado"], [1300,1200,1900,3080,2600], bonoMovs)
    : wp("Sin días en campo ni pagos de bono en el periodo.", {italics:true, color:"6B7280"});
  body += wp("Informe generado a partir del registro digital de actividades del Área de Proyectos.", {italics:true,color:"6B7280",size:16, after:0});
  try{
    const blob = await buildMembreteDocx(body);
    await downloadsCap.save({ filename: `Informe_Compensatorios_Bonos_${ym}.docx`, data: blob });
    showMsg("Informe de compensatorios y bonos descargado.", "ok");
  }catch(err){
    showMsg("No se pudo generar el Word: " + (err.message||err.code), "bad");
  }
}

// Empaqueta un cuerpo de Word con el membrete de Process en encabezado y pie, y devuelve el archivo .docx.
// images (opcional): gráficas del cuerpo [{base64, relId}] creadas con wImage().
async function buildMembreteDocx(body, images){
  images = images || [];
  body += `<w:sectPr><w:headerReference w:type="default" r:id="rIdHeader1"/><w:footerReference w:type="default" r:id="rIdFooter1"/><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="2500" w:right="1080" w:bottom="2600" w:left="1080" w:header="300" w:footer="300"/></w:sectPr>`;
  const HEADER_REL_ID = 900, FOOTER_REL_ID = 901, pageWpx = 816;
  const headerImg = wImageAnchor(MEMBRETE_HEADER_B64, HEADER_REL_ID, pageWpx, Math.round(pageWpx*(MEMBRETE_HEADER_DIM.h/MEMBRETE_HEADER_DIM.w)), "top");
  const footerImg = wImageAnchor(MEMBRETE_FOOTER_B64, FOOTER_REL_ID, pageWpx, Math.round(pageWpx*(MEMBRETE_FOOTER_DIM.h/MEMBRETE_FOOTER_DIM.w)), "bottom");
  const NS = `xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"`;
  const XMLH = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`;
  const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const zip = new JSZip();
  zip.file("[Content_Types].xml", `${XMLH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`);
  zip.file("_rels/.rels", `${XMLH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/document.xml", `${XMLH}<w:document ${NS}><w:body>${body}</w:body></w:document>`);
  zip.file("word/_rels/document.xml.rels", `${XMLH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdHeader1" Type="${REL}/header" Target="header1.xml"/><Relationship Id="rIdFooter1" Type="${REL}/footer" Target="footer1.xml"/>${images.map(im=>`<Relationship Id="rIdImg${im.relId}" Type="${REL}/image" Target="media/chart${im.relId}.png"/>`).join("")}</Relationships>`);
  zip.file("word/header1.xml", `${XMLH}<w:hdr ${NS}>${headerImg.xml}</w:hdr>`);
  zip.file("word/footer1.xml", `${XMLH}<w:ftr ${NS}>${footerImg.xml}</w:ftr>`);
  zip.file("word/_rels/header1.xml.rels", `${XMLH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdImg${HEADER_REL_ID}" Type="${REL}/image" Target="media/membreteHeader.png"/></Relationships>`);
  zip.file("word/_rels/footer1.xml.rels", `${XMLH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdImg${FOOTER_REL_ID}" Type="${REL}/image" Target="media/membreteFooter.png"/></Relationships>`);
  zip.file("word/media/membreteHeader.png", headerImg.base64, {base64:true});
  zip.file("word/media/membreteFooter.png", footerImg.base64, {base64:true});
  images.forEach(im=> zip.file(`word/media/chart${im.relId}.png`, im.base64, {base64:true}));
  return zip.generateAsync({ type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

// --- Datos (de todos los meses; solo se cargan con sesión de admin) ---
// Cancela las lecturas de compensatorios/bonos y borra esos datos de memoria (al cerrar sesión de admin).
function stopCompData(){
  compUnsubs.forEach(u=>{ try{ u && u(); }catch(e){} });
  compUnsubs = [];
  compEntries = []; campoEntries = []; compAjustes = {}; campoPagos = {}; compSaldos = {};
  costosCfg = null; costosIng = {}; gastos = [];
  compLoaded = {comp:false, campo:false};
}
// Escucha en tiempo real todo lo que necesitan Compensatorios y Bonos (solo con sesión de admin).
function subscribeCompData(){
  stopCompData();
  if(!db || !isOwner) return;
  const rr = ()=>{ if(view==="compensatorios" || view==="bonos") render(); };
  const rrCostos = ()=>{ if(view==="costos" || view==="proyectos" || view==="informes") render(); };
  const toMap = snap=>{ const m = {}; snap.docs.forEach(d=>{ m[d.id] = d.data(); }); return m; };
  // Consultas de un solo campo (sin orderBy) para no requerir índices compuestos; se ordena en el navegador.
  // Horas Extra (generan compensatorio o pago) y días Compensatorio (descuentan).
  compUnsubs.push(db.collection("activities").where("tipoHora","in",["Extra","Compensatorio"]).limit(5000)
    .onSnapshot(snap=>{ compEntries = snap.docs.map(d=>({ _id:d.id, ...d.data() })); compLoaded.comp = true; rr(); },
      err=>showGlobalError("Compensatorios", err)));
  // Registros en campo (bono de campo).
  compUnsubs.push(db.collection("activities").where("actividad","==",ACTIVIDAD_CAMPO).limit(5000)
    .onSnapshot(snap=>{ campoEntries = snap.docs.map(d=>({ _id:d.id, ...d.data() })); compLoaded.campo = true; rr(); },
      err=>showGlobalError("Bonos de campo", err)));
  compUnsubs.push(db.collection("comp_ajustes").limit(5000)
    .onSnapshot(snap=>{ compAjustes = toMap(snap); rr(); }, err=>showGlobalError("Ajustes de compensatorios (revisa las reglas de Firestore)", err)));
  compUnsubs.push(db.collection("campo_pagos").limit(5000)
    .onSnapshot(snap=>{ campoPagos = toMap(snap); rr(); }, err=>showGlobalError("Pagos de bono de campo (revisa las reglas de Firestore)", err)));
  // Costos (Fase 2): parámetros y salarios, y gastos de los proyectos.
  compUnsubs.push(db.collection("costos").limit(500)
    .onSnapshot(snap=>{ const m = {}; let cfg = null; snap.docs.forEach(d=>{ if(d.id==="config") cfg = d.data(); else if(d.id.startsWith("ing_")) m[d.id.slice(4)] = d.data(); }); costosCfg = cfg; costosIng = m; rrCostos(); },
      err=>showGlobalError("Costos (revisa las reglas de Firestore)", err)));
  compUnsubs.push(db.collection("proyecto_gastos").limit(5000)
    .onSnapshot(snap=>{ gastos = snap.docs.map(d=>({ id:d.id, ...d.data() })); rrCostos(); },
      err=>showGlobalError("Gastos de proyectos (revisa las reglas de Firestore)", err)));
  compUnsubs.push(db.collection("comp_saldos").limit(500)
    .onSnapshot(snap=>{ compSaldos = toMap(snap); rr(); }, err=>showGlobalError("Saldos iniciales (revisa las reglas de Firestore)", err)));
}

// ---------- Subscripciones ----------
// ---------- 10. SUSCRIPCIONES (lecturas en tiempo real de Firebase) ----------
// Registros del ingeniero seleccionado en el mes seleccionado.
function subscribeMine(){
  if(unsubMine) unsubMine();
  if(!db || !selectedEngineer) return;
  const {start,end} = monthRange(selectedMonth);
  // Consulta en tiempo real: cada cambio en Firebase vuelve a dibujar la pantalla.
  unsubMine = db.collection("activities")
    .where("engineer","==",selectedEngineer).where("fecha",">=",start).where("fecha","<=",end)
    .orderBy("fecha","desc").limit(500)
    .onSnapshot(snap=>{
      myEntries = snap.docs.map(d=>({ _id:d.id, ...d.data() }));
      render();
    }, err=>showGlobalError("Mis actividades", err));
}

// Tareas abiertas del ingeniero seleccionado (de cualquier mes) para el selector 'Tarea'.
function subscribeOpenTasks(){
  if(unsubOpenTasks) unsubOpenTasks();
  if(!db || !selectedEngineer) return;
  // Sin límite de mes a propósito: una tarea bloqueada puede retomarse semanas después.
  unsubOpenTasks = db.collection("activities")
    .where("engineer","==",selectedEngineer).orderBy("fecha","desc").limit(300)
    .onSnapshot(snap=>{
      const entries = snap.docs.map(d=>d.data());
      const byTask = {};
      entries.forEach(d=>{
        if(!d.taskId) return; // registros antiguos sin tarea asignada: no entran al selector
        const t = byTask[d.taskId] || { taskId:d.taskId, proyecto:d.proyecto, actividad:d.actividad, detalle:d.detalle, pct:null, estado:null, fecha:null, _sortKey:"" };
        const sortKey = (d.fecha||"") + "T" + (d.createdAt||"");
        if(sortKey >= t._sortKey){
          t._sortKey = sortKey; t.fecha = d.fecha; t.proyecto = d.proyecto; t.actividad = d.actividad; t.detalle = d.detalle;
          if(typeof d.pct === "number") t.pct = d.pct;
          if(d.estado) t.estado = d.estado;
        }
        byTask[d.taskId] = t;
      });
      openTasksList = Object.values(byTask)
        .filter(t=>t.estado!=="Completada")
        .sort((a,b)=> (b._sortKey||"").localeCompare(a._sortKey||""));
      if(view==="form") render();
    }, err=>showGlobalError("Tareas abiertas", err));
}

// Registros de todo el equipo en el mes seleccionado (resumen e informes).

// Reúne las cifras del mes para el informe mensual de gestión y la pestaña Informes.
function buildReportData(){
  const {start, end} = monthRange(selectedMonth);
  const {byEng} = computeStats();
  const porEng = engineersList.map(eng=>{
    const e = byEng[eng.name];
    return { name:eng.name, n:e.n, horas:e.horas, horasExtra:e.horasExtra, horasAusencia:e.horasAusencia,
      completedCount:e.completedCount, openCount:e.openCount };
  });
  // Horas que consume cada colaborador por categoría y por proyecto/servicio/capacitación.
  // Incluye horas normales y extra; no incluye ausencias (vacaciones, incapacidad, compensatorio tomado…).
  const CATS_HORAS = ["Proyecto","Servicio","Capacitación","Apoyo interno / sin código","Otro"];
  const horasEngCat = {};   // ingeniero -> {categoría: horas, total}
  const proyEng = {};       // código -> {codigo, nombre, categoria, total, extra, eng: {ingeniero: {h, extra}}}
  const ausencias = {};     // tipo de ausencia -> horas del área
  allEntries.forEach(d=>{
    const tipo = d.tipoHora || "Normal";
    const h = Number(d.horas)||0;
    if(AUSENCIA_TYPES.includes(tipo)){ ausencias[tipo] = (ausencias[tipo]||0) + h; return; }
    if(!h) return;
    const cat = proyectoCategoria(d.proyecto);
    const e = horasEngCat[d.engineer] || (horasEngCat[d.engineer] = { total:0 });
    e[cat] = (e[cat]||0) + h; e.total += h;
    if(!["Proyecto","Servicio","Capacitación"].includes(cat)) return;
    // Se agrupa por el código (lo que va antes de " - ") para no separar un proyecto si cambió su nombre
    const label = String(d.proyecto||"").trim();
    const m = label.match(/^(\d[\w-]*)\s*(?:-\s|$)/);
    const codigo = m ? m[1] : label;
    const pr = projectsList.find(x=>String(x.codigo||"").trim()===codigo);
    const p = proyEng[codigo] || (proyEng[codigo] = { codigo, proyecto:pr||null, nombre: pr ? projectOptionLabel(pr) : label, categoria: cat, total:0, extra:0, eng:{} });
    const pe = p.eng[d.engineer] || (p.eng[d.engineer] = { h:0, extra:0 });
    pe.h += h; p.total += h;
    if(tipo==="Extra"){ pe.extra += h; p.extra += h; }
  });
  const horasPorProyectoIng = Object.values(proyEng).sort((a,b)=> CATS_HORAS.indexOf(a.categoria)-CATS_HORAS.indexOf(b.categoria) || b.total-a.total);
  const catsHorasConDatos = CATS_HORAS.filter(c=>Object.values(horasEngCat).some(e=>e[c]>0));
  const horasCat = {}; // horas del área por categoría (suman el total trabajado)
  Object.values(horasEngCat).forEach(e=>CATS_HORAS.forEach(c=>{ if(e[c]) horasCat[c] = (horasCat[c]||0) + e[c]; }));
  // Horas extra por colaborador en grupos que no se repiten: movilización (siempre se compensa),
  // domingo/festivo (normalmente se paga), sábado y entre semana (se compensan).
  const extras = engineersList.map(eng=>{
    const x = { name:eng.name, semana:0, sabado:0, dominical:0, movilizacion:0, total:0 };
    allEntries.filter(d=>d.engineer===eng.name && (d.tipoHora||"Normal")==="Extra").forEach(d=>{
      const h = Number(d.horas)||0;
      const k = esMovilizacion(d) ? "movilizacion" : esDominical(d.fecha) ? "dominical" : weekdayOf(d.fecha)===6 ? "sabado" : "semana";
      x[k] += h; x.total += h;
    });
    return x;
  }).filter(x=>x.total>0);
  // Bloqueos reales (estado = "Bloqueada"): van a gerencia como riesgo.
  const bloqueos = allEntries.filter(d=> d.estado==="Bloqueada").sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  const totalHoras = porEng.reduce((s,e)=>s+e.horas,0);
  return { start, end, porEng, horasEngCat, horasCat, horasPorProyectoIng, catsHorasConDatos, extras, bloqueos, ausencias, totalHoras,
    totalRegistros: porEng.reduce((s,e)=>s+e.n,0),
    sinRegistros: porEng.filter(e=>e.n===0).map(e=>e.name) };
}

// Alertas del área para el informe: consumo de horas, contratos por vencer, pagos pendientes y órdenes abiertas.
function alertasArea(){
  const sobre = projectsList.map(p=>({ p, c:consumoDe(p) })).filter(x=>x.c && !x.c.cargando && !x.c.error && x.c.nivel!=="ok")
    .sort((a,b)=>b.c.pct-a.c.pct);
  const vencen = projectsList.filter(p=>estadoProy(p)==="Contrato vigente" && p.fechaFin && diasHasta(p.fechaFin)<=DIAS_AVISO_VENCIMIENTO)
    .sort((a,b)=>a.fechaFin.localeCompare(b.fechaFin));
  const pendPago = projectsList.filter(p=>estadoProy(p)==="Ejecutado pendiente de pago" || (p.ordenes||[]).some(o=>o.estado==="Ejecutada pendiente de pago"));
  const ordAbiertas = projectsList.reduce((a,p)=>a+ordenesAbiertas(p).length, 0);
  const activosSinPres = projectsList.filter(p=>proyActivo(p) && !presupuestoHoras(p));
  return { sobre, vencen, pendPago, ordAbiertas, activosSinPres };
}

// Genera y descarga el informe mensual de gestión (Word, condensado para gerencia, con membrete).
async function downloadWordReport(){

  const r = buildReportData();
  const u = utilizacionMes(r);
  const al = alertasArea();
  const cm = costosDelMes(r); // null si todavía no hay salarios registrados
  const h1 = v => (Number(v)||0).toFixed(1)+" h";
  const pctTxt = v => v==null ? "—" : Math.round(v)+"%";
  const dias = h => fmtN((Number(h)||0)/MAX_HORAS)+" d";
  const fechaCorte = new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"});

  const totalExtra = r.extras.reduce((a,x)=>a+x.total,0);
  const totalDominical = r.extras.reduce((a,x)=>a+x.dominical,0);
  const totalAusencia = Object.values(r.ausencias).reduce((a,h)=>a+h,0);
  const proyMes = r.horasPorProyectoIng;
  let body = "";
  body += wp("INFORME MENSUAL DE GESTIÓN", {bold:true, color:"1F4E78", size:32, after:40});
  body += wp("Área de Proyectos", {bold:true, color:"6B7280", size:24, after:20});
  body += wp(`Periodo: ${monthLabel(selectedMonth)}   ·   Corte: ${fechaCorte}`, {italics:true, color:"6B7280", size:20, after:260});

  // 1. Resumen ejecutivo: indicadores clave y hallazgos del mes
  body += hd("1. Resumen ejecutivo");
  if(r.totalRegistros === 0){
    body += wp("No se registraron actividades durante el periodo seleccionado.");
  } else {
    body += wTable(["Indicador","Valor","Detalle"], [3200,1600,5280], [
      ["Horas trabajadas", h1(r.totalHoras), `${r.porEng.filter(e=>e.n>0).length} de ${r.porEng.length} colaboradores con registros`],
      ["Utilización del equipo", pctTxt(u.pct), `${h1(u.fact)} en proyectos y servicios; ${h1(u.noFact)} en capacitación y apoyo interno`],
      ["Horas extra", h1(totalExtra), totalExtra ? `${h1(totalDominical)} en domingos o festivos` : "Sin horas extra"],

      ["Códigos con horas en el mes", String(proyMes.length), proyMes.length ? ["Proyecto","Servicio","Capacitación"].map(c=>{ const n = proyMes.filter(p=>p.categoria===c).length; return n ? `${n} ${c==="Proyecto" ? (n===1?"proyecto":"proyectos") : c==="Servicio" ? (n===1?"servicio":"servicios") : (n===1?"capacitación":"capacitaciones")}` : ""; }).filter(Boolean).join(" · ") : "—"],
      ["Proyectos en alerta de consumo", String(al.sobre.length), al.sobre.length ? al.sobre.map(x=>`${x.p.codigo} (${Math.round(x.c.pct)}%)`).join(" · ") : "Ninguno sobre el 80 % de su presupuesto"],
      ...(cm ? [["Costo del área en el mes", fmtCOP(cm.total), `${cm.total ? Math.round(cm.noFacturable/cm.total*100) : 0}% en capacitación y apoyo interno (no facturable)`]] : []),
      ["Bloqueos reportados", String(r.bloqueos.length), r.bloqueos.length ? "Ver sección 6" : "Sin bloqueos"]

    // Hallazgos: solo lo que la tabla de indicadores no dice (dónde se concentraron las horas y quién tiene baja utilización)

      cm.lista.map(f=>[f.nombre, fmtCOP(f.mo), fmtCOP(f.recargo), fmtCOP(f.bono), fmtCOP(f.gastos), fmtCOP(f.total)])
        .concat([["Total del área", fmtCOP(cm.mo), fmtCOP(cm.recargo), fmtCOP(cm.bono), fmtCOP(cm.gastos), fmtCOP(cm.total)]]));
    body += wp(`Costo de la hora = salario × factor prestacional ÷ horas laborales del mes. Recargo solo en horas extra de domingo o festivo pagadas en dinero; las compensadas con tiempo se cuestan como hora normal.${cm.sinSalario.length ? ` Horas sin costear por falta de salario registrado: ${cm.sinSalario.join(", ").replace(/\.$/,"")}.` : ""}`, {italics:true, color:"6B7280", size:16});
  }

  body += hd("5. Horas extra");
  if(r.extras.length){
    body += wTable(["Colaborador","Entre semana","Sábado","Domingo / festivo","Movilización","Total"], [2280,1560,1560,1560,1560,1560],
      r.extras.map(x=>[x.name, h1(x.semana), h1(x.sabado), h1(x.dominical), h1(x.movilizacion), h1(x.total)])
        .concat([["Total del área", h1(r.extras.reduce((a,x)=>a+x.semana,0)), h1(r.extras.reduce((a,x)=>a+x.sabado,0)), h1(totalDominical), h1(r.extras.reduce((a,x)=>a+x.movilizacion,0)), h1(totalExtra)]]));
    body += wp("Domingo / festivo: normalmente se pagan en dinero. Entre semana, sábado y movilización a campo: se compensan con tiempo. El detalle de pagos y saldos está en el informe de compensatorios y bonos.", {italics:true, color:"6B7280", size:16});

  if(al.pendPago.length) acc.push(`Hacer seguimiento al cobro de ${al.pendPago.map(p=>p.codigo).join(", ")}.`);
  if(totalDominical) acc.push(`Programar el pago de ${h1(totalDominical)} extra de domingos o festivos, o acordar su compensación.`);
  const bajaUtil2 = u.filas.filter(f=>f.pct!=null && f.pct < 50);
  if(bajaUtil2.length) acc.push(`Revisar la asignación de ${bajaUtil2.map(f=>f.name).join(", ")} a proyectos o servicios facturables.`);
  if((r.horasCat["Apoyo interno / sin código"]||0) > 0) acc.push(`Asignar código a las actividades registradas sin proyecto, para que sus horas se puedan atribuir.`);
  if(al.activosSinPres.length) acc.push(`Registrar el presupuesto de horas de ${al.activosSinPres.length} proyecto(s) activo(s) para medir su consumo: ${al.activosSinPres.map(p=>p.codigo).join(", ")}.`);
  if(cm && cm.sinSalario.length) acc.push(`Registrar el salario de ${cm.sinSalario.join(", ")} para costear todas sus horas.`);
  if(r.sinRegistros.length) acc.push(`Validar con ${r.sinRegistros.join(" y ")} la falta de registros en el periodo.`);
  if(acc.length) acc.forEach(t=>{ body += wBullet(t); });
  else body += wp("El periodo no presenta alertas que requieran acción.", {color:"374151"});
  body += wp("Informe generado a partir del registro digital de actividades del Área de Proyectos. El detalle de cada actividad está en el archivo de datos del mes (Excel).", {italics:true,color:"6B7280",size:16, after:0});

  try{
    const blob = await buildMembreteDocx(body, images);
    await downloadsCap.save({ filename: `Informe_Gestion_${selectedMonth}.docx`, data: blob });
    showMsg("Informe mensual de gestión descargado.", "ok");
  }catch(err){
    showMsg("No se pudo generar el Word: " + (err.message||err.code), "bad");
  }
}

// ---------- Datos del mes en Excel: hoja "Todos" + una hoja por ingeniero con su tabla de actividades ----------
// El archivo .xlsx se arma a mano con JSZip (mismo método que el Word), sin librerías adicionales.
function xlsxCol(i){ let s = ""; i++; while(i>0){ const m = (i-1)%26; s = String.fromCharCode(65+m) + s; i = Math.floor((i-1)/26); } return s; }
function xlsxNombreHoja(nombre, usados){
  let n = String(nombre||"Hoja").replace(/[\[\]:*?\/\\]/g," ").trim().slice(0,31) || "Hoja";
  let base = n, k = 2;
  while(usados.has(n.toLowerCase())){ const suf = ` (${k++})`; n = base.slice(0, 31-suf.length) + suf; }
  usados.add(n.toLowerCase());
  return n;
}
function xlsxFechaSerial(f){ const [y,m,d] = f.split("-").map(Number); return Math.round((Date.UTC(y,m-1,d) - Date.UTC(1899,11,30)) / 86400000); }
// Arma el XML de una hoja. cols: [{t:"Título", w:ancho, tipo:"txt"|"num"|"fecha"|"pct"}], filas: arreglos de valores.
function xlsxHoja(cols, filas, totalCol){
  const cel = (ref, v, tipo, estilo) => {
    if(v==null || v==="") return `<c r="${ref}" s="${estilo||0}"/>`;
    if(tipo==="fecha") return `<c r="${ref}" s="2"><v>${xlsxFechaSerial(v)}</v></c>`;
    if(tipo==="num" || tipo==="pct") return `<c r="${ref}" s="${tipo==="pct"?4:3}"><v>${Number(v)}</v></c>`;
    // Se quitan caracteres de control que dañarían el archivo si alguien los pegó en un campo
    return `<c r="${ref}" s="${estilo||0}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,""))}</t></is></c>`;
  };
  let rows = `<row r="1">${cols.map((c,i)=>cel(xlsxCol(i)+"1", c.t, "txt", 1)).join("")}</row>`;
  filas.forEach((f,ri)=>{ const rn = ri+2; rows += `<row r="${rn}">${f.map((v,ci)=>cel(xlsxCol(ci)+rn, v, cols[ci].tipo)).join("")}</row>`; });
  if(!filas.length) rows += `<row r="2">${cel("A2", "Sin registros en el mes", "txt")}</row>`;
  const ultima = filas.length + 1;
  if(totalCol!=null && filas.length){
    const rn = ultima + 1, colL = xlsxCol(totalCol);
    const suma = filas.reduce((a,f)=>a+(Number(f[totalCol])||0),0);
    rows += `<row r="${rn}">${cel("A"+rn, "Total horas registradas", "txt", 5)}<c r="${colL}${rn}" s="6"><f>SUM(${colL}2:${colL}${ultima})</f><v>${Math.round(suma*100)/100}</v></c></row>`;
  }
  const ancho = cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.w}" customWidth="1"/>`).join("");
  const ref = `A1:${xlsxCol(cols.length-1)}${Math.max(ultima,1)}`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${ancho}</cols><sheetData>${rows}</sheetData>${filas.length ? `<autoFilter ref="${ref}"/>` : ""}</worksheet>`;
}
// Descarga el Excel con la tabla de actividades del mes (la misma información de "Mis actividades").
async function downloadExcelMes(){
  if(!downloadsCap){ showMsg("La descarga no está disponible en esta vista.", "bad"); return; }
  if(typeof JSZip === "undefined"){ showMsg("No se pudo cargar el generador de archivos. Intenta de nuevo.", "bad"); return; }
  const COLS = [
    {t:"Fecha", w:11, tipo:"fecha"}, {t:"Día", w:12, tipo:"txt"}, {t:"Tipo de hora", w:14, tipo:"txt"}, {t:"Tipo de extra", w:20, tipo:"txt"},
    {t:"Actividad", w:26, tipo:"txt"}, {t:"Proyecto / centro de costo", w:40, tipo:"txt"}, {t:"Detalle", w:48, tipo:"txt"},
    {t:"Estado", w:12, tipo:"txt"}, {t:"% avance", w:10, tipo:"pct"}, {t:"Horas", w:8, tipo:"num"}, {t:"Observaciones", w:48, tipo:"txt"}
  ];
  const fila = d => {
    const tipo = d.tipoHora || "Normal";
    return [d.fecha, diaLabel(d.fecha), tipo, tipo==="Extra" ? (d.extraTipo||"Trabajo normal") : "", d.actividad||"", d.proyecto||"", d.detalle||"",
      d.estado||"", d.pct!=null && d.pct!=="" ? Number(d.pct)/100 : "", Number(d.horas)||0, d.obs||""];
  };
  const orden = (a,b)=> (a.fecha||"").localeCompare(b.fecha||"") || (a.createdAt||"").localeCompare(b.createdAt||"");
  const usados = new Set();
  const hojas = [];
  // Hoja "Todos": todo el equipo, con la columna de colaborador
  const todos = allEntries.slice().sort((a,b)=> orden(a,b) || (a.engineer||"").localeCompare(b.engineer||""));
  hojas.push({ nombre: xlsxNombreHoja("Todos", usados), xml: xlsxHoja([{t:"Colaborador", w:18, tipo:"txt"}].concat(COLS), todos.map(d=>[d.engineer].concat(fila(d))), COLS.length-1) });
  // Una hoja por ingeniero (también los que no tienen registros en el mes)
  const nombres = engineerNames();
  allEntries.forEach(d=>{ if(d.engineer && !nombres.includes(d.engineer)) nombres.push(d.engineer); });
  nombres.forEach(n=>{
    const regs = allEntries.filter(d=>d.engineer===n).sort(orden);
    hojas.push({ nombre: xlsxNombreHoja(n, usados), xml: xlsxHoja(COLS, regs.map(fila), COLS.length-2) });
  });
  const X = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`;
  const NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main", REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  // Estilos: 0 normal · 1 encabezado azul · 2 fecha · 3 número 0.0 · 4 porcentaje · 5 total en negrita · 6 total numérico en negrita
  const styles = `${X}<styleSheet xmlns="${NS}"><numFmts count="2"><numFmt numFmtId="164" formatCode="yyyy-mm-dd"/><numFmt numFmtId="165" formatCode="0.0"/></numFmts>`
    + `<fonts count="3"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font><font><b/><sz val="10"/><name val="Arial"/></font></fonts>`
    + `<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F4E78"/><bgColor indexed="64"/></patternFill></fill></fills>`
    + `<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`
    + `<cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>`
    + `<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf>`
    + `<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top"/></xf>`
    + `<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top"/></xf>`
    + `<xf numFmtId="9" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top"/></xf>`
    + `<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>`
    + `<xf numFmtId="165" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/></cellXfs>`
    + `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const workbook = `${X}<workbook xmlns="${NS}" xmlns:r="${REL}"><sheets>${hojas.map((h,i)=>`<sheet name="${xmlEsc(h.nombre)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`;
  const wbRels = `${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${hojas.map((h,i)=>`<Relationship Id="rId${i+1}" Type="${REL}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rIdStyles" Type="${REL}/styles" Target="styles.xml"/></Relationships>`;
  const types = `${X}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hojas.map((h,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`;
  try{
    const zip = new JSZip();
    zip.file("[Content_Types].xml", types);
    zip.file("_rels/.rels", `${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
    zip.file("xl/workbook.xml", workbook);
    zip.file("xl/_rels/workbook.xml.rels", wbRels);
    zip.file("xl/styles.xml", styles);
    hojas.forEach((h,i)=> zip.file(`xl/worksheets/sheet${i+1}.xml`, h.xml));
    const blob = await zip.generateAsync({ type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    await downloadsCap.save({ filename: `Actividades_${selectedMonth}.xlsx`, data: blob });
    showMsg("Datos del mes descargados (Excel).", "ok");
  }catch(err){
    showMsg("No se pudo generar el Excel: " + (err.message||err.code), "bad");
  }
}

// ---------- Gráficas (canvas -> PNG base64, para incrustar en el Word) ----------
// Dibuja una gráfica de barras en un canvas y la devuelve como imagen PNG (para el Word).
function drawBarChartPNG(title, labels, values, colors){
  const W=920, H=520, padL=60, padR=30, padT=50, padB=90;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#1F4E78"; ctx.font = "bold 20px Arial"; ctx.textAlign = "left";
  ctx.fillText(title, padL, 30);
  const maxVal = Math.max(1, ...values);
  const niceMax = Math.ceil(maxVal*1.15 / 5) * 5 || 1;
  const chartH = H - padT - padB, chartW = W - padL - padR;
  // gridlines + eje Y
  ctx.strokeStyle = "#E2E8F0"; ctx.fillStyle = "#6B7280"; ctx.font = "12px Arial"; ctx.textAlign = "right";
  for(let i=0;i<=5;i++){
    const y = padT + chartH - (chartH*i/5);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(Math.round(niceMax*i/5), padL-8, y+4);
  }
  // barras
  const n = labels.length || 1;
  const slot = chartW/n, barW = Math.min(70, slot*0.55);
  labels.forEach((lab,i)=>{
    const v = values[i]||0;
    const barH = chartH * (v/niceMax);
    const x = padL + slot*i + (slot-barW)/2;
    const y = padT + chartH - barH;
    ctx.fillStyle = (colors && colors[i]) || "#1F4E78";
    ctx.fillRect(x,y,barW,barH);
    ctx.fillStyle = "#1F4E78"; ctx.font="bold 13px Arial"; ctx.textAlign="center";
    ctx.fillText(v.toFixed(1), x+barW/2, y-6);
    ctx.fillStyle = "#374151"; ctx.font="12px Arial";
    const words = String(lab).split(" ");
    let line1=lab, line2="";
    if(lab.length>16){ const mid=Math.ceil(words.length/2); line1=words.slice(0,mid).join(" "); line2=words.slice(mid).join(" "); }
    ctx.fillText(line1, x+barW/2, padT+chartH+18);
    if(line2) ctx.fillText(line2, x+barW/2, padT+chartH+34);
  });
  ctx.strokeStyle = "#9CA3AF"; ctx.beginPath(); ctx.moveTo(padL,padT+chartH); ctx.lineTo(W-padR,padT+chartH); ctx.stroke();
  return canvas.toDataURL("image/png").split(",")[1]; // base64 puro
}

// Imagen dentro del cuerpo del Word (gráficas).
function wImage(base64Png, relId, widthPx, heightPx){
  // 9525 EMU por pixel (96dpi)
  const cx = Math.round(widthPx*9525), cy = Math.round(heightPx*9525);
  return { base64: base64Png, xml: `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="200"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${relId}" name="chart${relId}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${relId}" name="chart${relId}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg${relId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>` };
}

// Imagen "flotante" anclada a la página (de borde a borde), usada para el membrete
// en el encabezado y pie de página del Word — distinto de wImage() que es inline en el cuerpo.
// Imagen 'flotante' de borde a borde para el membrete (encabezado y pie del Word).
function wImageAnchor(base64Png, relId, widthPx, heightPx, vAlign){
  const cx = Math.round(widthPx*9525), cy = Math.round(heightPx*9525);
  const xml = `<w:p><w:r><w:drawing><wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="${251658240+relId}" behindDoc="0" locked="0" layoutInCell="1" allowOverlap="1"><wp:simplePos x="0" y="0"/><wp:positionH relativeFrom="page"><wp:align>left</wp:align></wp:positionH><wp:positionV relativeFrom="page"><wp:align>${vAlign}</wp:align></wp:positionV><wp:extent cx="${cx}" cy="${cy}"/><wp:wrapNone/><wp:docPr id="${relId}" name="Membrete${relId}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${relId}" name="Membrete${relId}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg${relId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:anchor></w:drawing></w:r></w:p>`;
  return { base64: base64Png, xml };
}

// Escapa caracteres especiales para el XML del Word.
function xmlEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
// Párrafo de Word con formato (negrita, color, tamaño, espacio después).
function wp(text, opts={}){
  const { bold, color, size=21, after=160, italics, keepNext } = opts;
  let rpr = "";
  if(bold) rpr += "<w:b/>";
  if(italics) rpr += "<w:i/>";
  if(color) rpr += `<w:color w:val="${color}"/>`;
  rpr += `<w:sz w:val="${size}"/>`;
  return `<w:p><w:pPr>${keepNext?"<w:keepNext/>":""}<w:spacing w:after="${after}"/></w:pPr><w:r><w:rPr>${rpr}</w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}
// Viñeta de Word.
function wBullet(text){
  return `<w:p><w:pPr><w:spacing w:after="80"/><w:ind w:left="420" w:hanging="300"/></w:pPr><w:r><w:rPr><w:sz w:val="21"/></w:rPr><w:t xml:space="preserve">•  ${xmlEsc(text)}</w:t></w:r></w:p>`;
}
// Título de sección del Word con línea azul debajo.
function wHeading(text){
  return `<w:p><w:pPr><w:spacing w:before="280" w:after="140"/><w:pBdr><w:bottom w:val="single" w:sz="6" w:color="1F4E78" w:space="4"/></w:pBdr></w:pPr><w:r><w:rPr><w:b/><w:color w:val="1F4E78"/><w:sz w:val="26"/></w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}
// Celda de tabla de Word (encabezado azul o celda normal).
function wTc(text, width, header){
  const shd = header ? '<w:shd w:val="clear" w:fill="1F4E78"/>' : "";
  const rpr = header ? '<w:b/><w:color w:val="FFFFFF"/>' : "";
  return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${shd}</w:tcPr><w:p><w:r><w:rPr>${rpr}<w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p></w:tc>`;
}
// Tabla de Word completa (encabezados, anchos y filas).
function wTable(headers, widths, rows){
  const grid = widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("");
  const hdr = "<w:tr>" + headers.map((h,i)=>wTc(h,widths[i],true)).join("") + "</w:tr>";
  const body = rows.map(row=>"<w:tr>"+row.map((c,i)=>wTc(c,widths[i],false)).join("")+"</w:tr>").join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders><w:top w:val="single" w:sz="4" w:color="CCCCCC"/><w:left w:val="single" w:sz="4" w:color="CCCCCC"/><w:bottom w:val="single" w:sz="4" w:color="CCCCCC"/><w:right w:val="single" w:sz="4" w:color="CCCCCC"/><w:insideH w:val="single" w:sz="4" w:color="CCCCCC"/><w:insideV w:val="single" w:sz="4" w:color="CCCCCC"/></w:tblBorders></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${hdr}${body}</w:tbl><w:p/>`;
}

// ---------- 12. ACCESO DE ADMINISTRADOR E INICIO ----------
// Inicia sesión de administrador con correo y contraseña de Firebase.
async function submitAdminLogin(){
  const emailEl = document.getElementById("admin_email_input");
  const passEl = document.getElementById("admin_pass_input");
  const email = emailEl ? emailEl.value.trim() : "";
  const password = passEl ? passEl.value : "";
  if(!email || !password){ adminLoginError = "Completa correo y contraseña."; render(); return; }
  try{
    await window.__firebaseAuth.loginAdmin(email, password);
    // isOwner se actualiza solo via onChange() más abajo
    adminLoginOpen = false; adminLoginError = "";
    render();
  }catch(err){
    adminLoginError = "No se pudo iniciar sesión: " + (err.message || err.code);
    render();
  }
}
// Cierra la sesión de administrador y vuelve al modo normal.
async function lockAdmin(){
  stopCompData(); // antes de salir, para que las colecciones solo-admin no den error de permisos
  try{ await window.__firebaseAuth.logoutAdmin(); }catch(e){ console.error(e); }
  view = "form"; menuOpen = false;
}

// Arranque de la app: espera la conexión con Firebase, inicia sesión anónima y activa las suscripciones.
async function init(){
  document.addEventListener("click", e=>{ if(menuOpen && !e.target.closest(".menuwrap")){ menuOpen = false; render(); } });
  document.addEventListener("keydown", e=>{ if(menuOpen && e.key==="Escape"){ menuOpen = false; render(); } });
  render();
  let tries = 0;
  // Espera hasta 5 segundos a que cargue el módulo de Firebase.
  while(!(window.__firebaseDb && window.__firebaseAuth) && tries < 50){ await new Promise(r=>setTimeout(r,100)); tries++; }
  db = window.__firebaseDb || null;
  // Descarga un archivo creando un enlace temporal y haciéndole clic.
  downloadsCap = { save: async ({filename, data})=>{
    const blob = (data instanceof Blob) ? data : new Blob([data], {type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/octet-stream"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }};
  if(!db || !window.__firebaseAuth){
    app.innerHTML = `<h1>Registro Diario de Actividades</h1><div class="card"><div class="empty">No se pudo conectar con Firebase. Revisa tu conexión o recarga la página.</div></div>`;
    return;
  }
  // Sesión anónima: permite a cualquiera usar el registro diario sin contraseña.
  try{ await window.__firebaseAuth.ensureSignedIn(); }
  catch(err){
    app.innerHTML = `<h1>Registro Diario de Actividades</h1><div class="card"><div class="empty">No se pudo iniciar sesión en Firebase: ${err.message||err.code}. Revisa que "Anónimo" esté activado en Authentication → Sign-in method.</div></div>`;
    return;
  }
  // Cuando entra o sale un administrador, carga o quita los datos de Compensatorios y Bonos.
  window.__firebaseAuth.onChange(()=>{
    const wasOwner = isOwner;
    isOwner = window.__firebaseAuth.isAdminNow();
    if(wasOwner !== isOwner){
      if(isOwner) subscribeCompData();
      else { stopCompData(); if(["compensatorios","bonos","informes","costos"].includes(view)) view = "form"; }
      render();
    }
  });
  isOwner = window.__firebaseAuth.isAdminNow();
  if(isOwner && !compUnsubs.length) subscribeCompData();
  subscribeEngineers();
  subscribeAll();
  subscribeEstimates();
  subscribeProjects();
  render();
}
init();
</script>
