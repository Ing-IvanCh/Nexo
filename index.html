<!DOCTYPE html>
<!--
  REGISTRO DIARIO DE ACTIVIDADES — Área de Proyectos · Process Solutions
  App de una sola página: todo (diseño, lógica y conexión) vive en este archivo para publicarlo
  en GitHub Pages sin instalar nada. Se publica con el nombre index.html.
  Partes del archivo, en orden:
    1. Script tipo módulo .... Conexión con Firebase (sesiones y base de datos)
    2. Bloque de estilos ..... Diseño visual (colores, tarjetas, tablas, versión celular)
    3. Contenedor "app" ...... Donde se dibuja la app
    4. Script principal ...... Lógica de la app (pantallas, cálculos, informes). Empieza con un mapa del código.
  Las reglas de seguridad de la base de datos están en el archivo firestore.rules (consola de Firebase).
-->
<html lang="es">
<head>
<meta charset="UTF-8">

<script type="module">
  // CONEXIÓN CON FIREBASE (módulo). Carga las librerías oficiales de Firebase y expone dos objetos
  // que usa el resto de la app: window.__firebaseAuth (sesiones) y window.__firebaseDb (base de datos).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import {
    getFirestore, collection as fsCollection, doc as fsDoc, query as fsQuery,
    where as fsWhere, orderBy as fsOrderBy, limit as fsLimit,
    onSnapshot as fsOnSnapshot, getDocs as fsGetDocs, getDoc as fsGetDoc,
    addDoc as fsAddDoc, setDoc as fsSetDoc, updateDoc as fsUpdateDoc, deleteDoc as fsDeleteDoc
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
  import {
    getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

  // --- Configuración de tu proyecto Firebase (dato público, no es una contraseña) ---
  const firebaseConfig = {
    apiKey: "AIzaSyD4HPRnO5U7p4wZ4jNfTa9umzeJACM067Y",
    authDomain: "registro-diario-de-activ-82bbc.firebaseapp.com",
    projectId: "registro-diario-de-activ-82bbc",
    storageBucket: "registro-diario-de-activ-82bbc.firebasestorage.app",
    messagingSenderId: "509408674128",
    appId: "1:509408674128:web:f857981906324954112c55"
  };
  // Correos con permisos de administrador (deben coincidir con la lista de firestore.rules)
  const ADMIN_EMAILS = [
    "ivan.chipiaje@prosolutions-int.com",
    "soporte_talento@prosolutions-int.com",
    "contabilidad@prosolutions-int.com",
    "jpaez@prosolutions-int.com",
    "dreyes@prosolutions-int.com"
  ];
  // Inicia Firebase, la base de datos Firestore y la autenticación.
  const fbApp = initializeApp(firebaseConfig);
  const firestoreDb = getFirestore(fbApp);
  const fbAuth = getAuth(fbApp);

  // Sesiones: anónima para todos; correo y contraseña para administradores (lista ADMIN_EMAILS).
  window.__firebaseAuth = {
    // Entra de forma anónima si todavía no hay sesión.
    async ensureSignedIn(){
      if(!fbAuth.currentUser){ await signInAnonymously(fbAuth); }
    },
    // Inicia sesión de administrador.
    async loginAdmin(email, password){
      await signInWithEmailAndPassword(fbAuth, email, password);
    },
    // Cierra la sesión de administrador y vuelve a la anónima.
    async logoutAdmin(){
      await signOut(fbAuth);
      await signInAnonymously(fbAuth);
    },
    // true si la sesión actual es de uno de los correos administradores.
    isAdminNow(){
      const u = fbAuth.currentUser;
      return !!(u && !u.isAnonymous && u.email && ADMIN_EMAILS.includes(u.email.toLowerCase()));
    },
    // Avisa cada vez que cambia la sesión (entra o sale un administrador).
    onChange(cb){ onAuthStateChanged(fbAuth, cb); }
  };

  // --- Adaptador: expone la misma API encadenable (db.collection/db.doc) que ya usa la app ---
  // Versión simple de un documento: get / set / update / delete / onSnapshot (tiempo real).
  function wrapDoc(ref){
    return {
      async get(){ const snap = await fsGetDoc(ref); return { exists: snap.exists(), data: ()=>snap.data() }; },
      async set(data){ return fsSetDoc(ref, data); },
      async update(data){ return fsUpdateDoc(ref, data); },
      async delete(){ return fsDeleteDoc(ref); },
      onSnapshot(cb, errCb){
        return fsOnSnapshot(ref, snap=> cb({ exists: snap.exists(), data: ()=>snap.data() }), errCb);
      }
    };
  }
  // Versión simple de una colección con consultas encadenables: where / orderBy / limit / get / onSnapshot / add.
  function wrapCollection(path){
    const base = fsCollection(firestoreDb, path);
    const constraints = [];
    const self = {
      where(f,op,v){ constraints.push(fsWhere(f,op,v)); return self; },
      orderBy(f,dir){ constraints.push(fsOrderBy(f, dir||"asc")); return self; },
      limit(n){ constraints.push(fsLimit(n)); return self; },
      async get(){
        const snap = await fsGetDocs(fsQuery(base, ...constraints));
        return { docs: snap.docs.map(d=>({ id:d.id, data:()=>d.data() })) };
      },
      onSnapshot(cb, errCb){
        return fsOnSnapshot(fsQuery(base, ...constraints), snap=>{
          cb({ docs: snap.docs.map(d=>({ id:d.id, data:()=>d.data() })) });
        }, errCb);
      },
      async add(data){ return fsAddDoc(base, data); }
    };
    return self;
  }
  window.__firebaseDb = {
    collection: (path)=>wrapCollection(path),
    doc: (path)=>wrapDoc(fsDoc(firestoreDb, path))
  };
</script>

  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

<script>

// MAPA DEL CÓDIGO DE LA APP (en el orden en que aparece en este archivo)

//   6. Registro diario ........... onSubmit() valida y guarda una actividad

//   9. Compensatorios y Bonos .... cálculo de saldos, pagos e informe Word propio
//  10. Suscripciones ............. lecturas en tiempo real de Firebase (onSnapshot)
//  11. Informes .................. pestaña Informes (indicadores y descargas), informe mensual de gestión (Word) y datos del mes (Excel)
//      Costos (Fase 2) ........... salarios, costo de la hora, gastos y costo real por proyecto (sección 8, solo admin)
//  12. Acceso admin e inicio ..... login de administrador e init()
// Colecciones de Firebase que usa: activities, config, config_engineers, config_projects,
// comp_ajustes, campo_pagos, comp_saldos (estas tres últimas solo para administradores).
// =====================================================================================
// 
// ---------- 1. CONFIGURACIÓN FIJA ----------
// Actividades que el ingeniero puede elegir en el formulario.
const ACTIVIDADES = ["Desarrollo de plano","Desarrollo de ingeniería","Servicio remoto","Servicio (en campo)",
  "Revisión de cronograma","Elaboración de informe","Reunión de seguimiento","Apoyo comercial",
  "Apoyo administrativo","Capacitación / formación","Gestión documental","Atención a cliente interno",
  "Planeación de proyecto","Soporte a otra área","Otro (especificar en detalle)"];
// Estados de avance de una tarea del ingeniero.
const ESTADOS = ["Pendiente","En curso","Completada","Bloqueada"];
// Tope de horas normales por día (jornada completa). También vale como 1 día en compensatorios.
const MAX_HORAS = 8.5;
// Tope de horas extra por día.
const MAX_EXTRA = 8.5;
// Tipos de hora del formulario. Los de AUSENCIA_TYPES son días no trabajados.
const TIPOS_HORA = ["Normal","Extra","Vacaciones","Compensatorio","Incapacidad","Permiso","Licencia"];
const AUSENCIA_TYPES = ["Vacaciones","Compensatorio","Incapacidad","Permiso","Licencia"];
// Tope de horas por día según el tipo de hora (se valida al guardar).
const TIPO_MAX = { "Normal": MAX_HORAS, "Extra": MAX_EXTRA, "Vacaciones": MAX_HORAS, "Compensatorio": MAX_HORAS, "Incapacidad": MAX_HORAS, "Permiso": MAX_HORAS, "Licencia": MAX_HORAS };
// Subtipos de hora extra: la movilización siempre se compensa con tiempo.
const EXTRA_SUBTYPES = ["Trabajo normal", "Movilización a campo"];
// Día de la semana (0=domingo..6=sábado) de una fecha "YYYY-MM-DD", calculado en UTC
// para que no dependa de la zona horaria del navegador.
// Devuelve el día de la semana (0 = domingo … 6 = sábado) de una fecha 'AAAA-MM-DD'.
function weekdayOf(fechaStr){
  if(!fechaStr) return null;
  const parts = fechaStr.split("-").map(Number);
  if(parts.length!==3 || parts.some(isNaN)) return null;
  return new Date(Date.UTC(parts[0], parts[1]-1, parts[2])).getUTCDay();
}
// Festivos de Colombia (copiados de la hoja FESTIVOS del "Control Integral Ingenieros").
// Para años nuevos basta con agregar las fechas aquí.
const FESTIVOS_CO = {

  "2026-01-01":"Año Nuevo","2026-01-12":"Reyes Magos","2026-03-23":"San José","2026-04-02":"Jueves Santo","2026-04-03":"Viernes Santo",
  "2026-05-01":"Día del Trabajo","2026-05-18":"Ascensión del Señor","2026-06-08":"Corpus Christi","2026-06-15":"Sagrado Corazón",
  "2026-06-29":"San Pedro y San Pablo","2026-07-13":"Virgen del Carmen / Chiquinquirá","2026-07-20":"Independencia de Colombia",
  "2026-08-07":"Batalla de Boyacá","2026-08-17":"Asunción de la Virgen","2026-10-12":"Día de la Raza","2026-11-02":"Todos los Santos",

  "2027-05-01":"Día del Trabajo","2027-05-10":"Ascensión del Señor","2027-05-31":"Corpus Christi","2027-06-07":"Sagrado Corazón",
  "2027-07-05":"San Pedro y San Pablo","2027-07-12":"Virgen de Chiquinquirá","2027-07-20":"Independencia de Colombia",

};

const DIAS_SEMANA = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

function esFestivo(f){ return !!FESTIVOS_CO[f]; }

function esDominical(f){ return weekdayOf(f)===0 || esFestivo(f); }  // domingo o festivo (igual que el Excel)
// Texto corto del día para las tablas: 'Dom', 'Lun · Festivo', etc.
function diaLabel(f){
  const w = weekdayOf(f); if(w==null) return "";
  return esFestivo(f) ? `${DIAS_SEMANA[w]} · Festivo` : DIAS_SEMANA[w];
}
// Saldos de la hoja "Resumen Bonos y Compensat." del Excel (corte al 1-oct-2026).
// El Excel calcula días = horas / 8, así que aquí se guardan en horas (días × 8).
const EXCEL_SALDOS_REF = {

  nicolas:  {nombre:"Nicolas Espitia",  compHoras:0,     domHoras:0,  bonoDias:43},
  lina:     {nombre:"Lina Angel",       compHoras:8,     domHoras:0,  bonoDias:3},
  martinri: {nombre:"Martinri Savedra", compHoras:143.7, domHoras:0,  bonoDias:46},

const SIN_PROYECTO = "Sin proyecto / servicio activo";
const POR_DEFINIR = "Por definir";
// ---------- 2. ESTADO DE LA APP ----------
// db: conexión a Firebase · downloadsCap: función para descargar archivos · isOwner: true si hay sesión de administrador
let db = null, downloadsCap = null, isOwner = false;
// Pestaña visible: form | resumen | equipo | proyectos | compensatorios | bonos
let view = "form";
let engineersList = [];   // [{id,name,cargo}]
let projectsList = [];    // [{id,codigo,nombre}]
// Ingeniero y mes seleccionados; se recuerdan en el navegador (localStorage) entre visitas.
let selectedEngineer = localStorage.getItem("ivan_sel_eng") || "";
let selectedMonth = localStorage.getItem("ivan_sel_month") || todayStr().slice(0,7);

let allEntries = [];

let estimates = {};

let unsubMine=null, unsubAll=null, unsubEst=null, unsubEng=null, unsubProj=null;

let formMsg = "", formMsgType = "ok";
let globalError = "";

// Muestra arriba un error de conexión con Firebase; si falta un índice, explica cómo crearlo.
function showGlobalError(context, err){
  console.error(context, err);
  globalError = `Error en "${context}": ${err && (err.message||err.code) || err}`;
  if(String(err && err.message).includes("requires an index")){
    globalError += " — Firestore necesita un índice para esta consulta. Abre la consola del navegador (F12), busca el link azul que empieza con 'https://console.firebase.google.com' y haz clic en 'Create Index'.";
  }
  render();
}
// Confirmación en pantalla pendiente (¿Seguro? Sí/No), en lugar de las ventanas confirm() del navegador.
let pendingConfirm = null;

let compUnsubs = [];
// Costos (Fase 2, solo admin): parámetros, salarios por ingeniero y gastos de los proyectos
let costosCfg = null;   // costos/config

let gastos = [];        // proyecto_gastos
let compSel = "";       // ingeniero abierto en la pestaña Compensatorios
let bonoSel = "";       // ingeniero abierto en la pestaña Bonos de campo
let openFolds = new Set(); // secciones plegables abiertas
// Proyectos
let projSel = "";              // id del proyecto abierto, o "__new__"
let projFiltroEstado = "activos", projFiltroTipo = "todos", projBusca = "";

let editingOrden = null;       // {proj, id} de la orden en edición

// Contenedor donde se dibuja toda la app.
const app = document.getElementById("app");
// Fecha de hoy en formato 'AAAA-MM-DD'.
function todayStr(){ return new Date().toISOString().slice(0,10); }
// Primer día, último día y número de días de un mes 'AAAA-MM'.
function monthRange(ym){
  const [y,m] = ym.split("-").map(Number);
  const start = ym + "-01";
  const lastDay = new Date(y, m, 0).getDate();
  const end = ym + "-" + String(lastDay).padStart(2,"0");
  return {start, end, days: lastDay};
}
// Clase de color de la etiqueta según el estado de una tarea.
function badgeClass(estado){
  return {"Pendiente":"b-pend","En curso":"b-curso","Completada":"b-comp","Bloqueada":"b-bloq"}[estado] || "b-curso";
}
// Convierte '2026-10' en 'octubre 2026'.
function monthLabel(ym){
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const [y,m] = ym.split("-").map(Number);
  return meses[m-1] + " " + y;
}
// Convierte un texto en un id válido para Firebase (minúsculas, sin tildes ni espacios).
function sanitizeId(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9_\-.~:@+]+/g,"_").replace(/^_+|_+$/g,"") || "x";
}
// Alias de sanitizeId (se usa para ids de ingenieros).
function slugify(name){ return sanitizeId(name); }
// Lista con los nombres de los ingenieros del equipo.
function engineerNames(){ return engineersList.map(e=>e.name); }

function projectOptionLabel(p){ return p.nombre ? `${p.codigo} - ${p.nombre}` : p.codigo; }
// Extrae el código numérico inicial de un texto de proyecto ('2047 - Hocol' -> '2047').
function proyectoCodigo(proyectoStr){
  const m = String(proyectoStr||"").trim().match(/^(\d{3,})/);
  return m ? m[1] : null;
}
// Clasifica un proyecto por su código para los informes: 3 = Proyecto, 2 = Servicio, 0 = Capacitación.
function proyectoCategoria(proyectoStr){
  if(proyectoStr===SIN_PROYECTO || proyectoStr===POR_DEFINIR || !proyectoStr) return "Apoyo interno / sin código";
  const cod = proyectoCodigo(proyectoStr);
  if(!cod) return "Apoyo interno / sin código";
  const first = cod[0];
  if(first==="3") return "Proyecto";
  if(first==="2") return "Servicio";
  if(first==="0") return "Capacitación";
  return "Otro";
}

// Botón ☰ (solo admin) con su menú desplegable. Si la página actual está en el menú,
// el botón muestra su nombre y queda resaltado para saber dónde se está.
function renderMenuBtn(){
  const actual = MENU_PAGES.find(([v])=>v===view);
  return `<div class="menuwrap">
      <div class="tab menubtn ${actual?"active":""}" id="btn_menu" role="button" aria-label="Más secciones" aria-expanded="${menuOpen}">☰${actual ? " "+actual[1] : ""}</div>

}
// ---------- 4. PANTALLAS ----------
// Dibuja toda la app: título, pestañas, selector de mes, la pestaña activa y la ventana de login.
// Se llama cada vez que cambian los datos o la pestaña. Al final conecta los eventos (wireEvents).

  app.innerHTML = `

          <button class="primary" id="btn_admin_submit" style="flex:1;margin-top:0">Entrar</button>
        </div>
      </div>
    </div>` : ""}
  `;

}

    .concat(projectsList.filter(proyActivo).map(p=>`<option value="${escH(projectOptionLabel(p))}">`)).join("");

// Tabla 'Mis actividades' del ingeniero seleccionado, con botones Editar y Eliminar.

      ? `<span class="confirmrow">¿Seguro? <button class="tiny bad" data-act="confirm-del-activity" data-id="${d._id}">Sí</button><button class="tiny" data-act="cancel-confirm">No</button></span>`
      : `<button class="tiny" data-act="edit-activity" data-id="${d._id}">Editar</button> <button class="del" data-act="ask-del-activity" data-id="${d._id}">Eliminar</button>`;
    const isEditing = editingId === d._id;

      <td data-label="Actividad">${d.actividad||""}</td>

      <td data-label="Estado">${d.estado?`<span class="badge ${badgeClass(d.estado)}">${d.estado}</span>`:"—"}</td>

// Identificador de la tarea a la que pertenece un registro (o uno armado con proyecto+actividad si es antiguo).
function taskKey(d){ return d.taskId || ("legacy:: " + (d.proyecto||SIN_PROYECTO) + " :: " + (d.actividad||"(sin definir)")); }
// Genera un id único para una tarea nueva.
function newTaskId(){ return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
// Texto de una tarea abierta en el selector 'Tarea' del formulario.
function taskLabel(t){ return `${t.proyecto} · ${t.actividad}${t.detalle?" — "+t.detalle.slice(0,40):""} (${t.pct!=null?t.pct+"%":"—"}, desde ${t.fecha})`; }
// Texto de ayuda debajo del tipo de hora.
function tipoHint(tipo){
  if(tipo==="Normal") return `Cuenta para el tope de ${MAX_HORAS} h/día de jornada regular.`;
  if(tipo==="Extra") return `Horas extra: no cuentan para el tope de ${MAX_HORAS} h — deben marcarse como Extra para poder sumarse aparte (máx. ${MAX_EXTRA} h/día).`;
  return `Día no laborado (${tipo}): no cuenta para el tope de horas de trabajo, se registra aparte.`;
}

// Calcula por ingeniero, para el mes: horas trabajadas, extra, ausencias y avance de sus tareas.
// Lo usan el Resumen general y los informes.
function computeStats(){
  const {days} = monthRange(selectedMonth);
  const weeks = days/7;
  const byEng = {};
  engineersList.forEach((e)=>byEng[e.name] = {n:0, horas:0, horasExtra:0, horasAusencia:0, horasPorTipo:{}, last:null, tasks:{}, cargo:e.cargo});
  allEntries.forEach(d=>{
    const e = byEng[d.engineer]; if(!e) return;
    const tipo = d.tipoHora || "Normal";
    const isWork = !AUSENCIA_TYPES.includes(tipo);
    e.n++;
    const h = typeof d.horas === "number" ? d.horas : 0;
    e.horasPorTipo[tipo] = (e.horasPorTipo[tipo]||0) + h;
    if(isWork){ e.horas += h; if(tipo==="Extra") e.horasExtra += h; }
    else { e.horasAusencia += h; }
    if(d.fecha && (!e.last || d.fecha > e.last)) e.last = d.fecha;
    if(!isWork) return; // las ausencias (vacaciones, incapacidad, etc.) no son "tareas" con avance
    // Agrupa por proyecto+actividad (o por id de tarea si lo tiene): una misma línea de trabajo
    // puede registrarse varios días, y lo que importa es su avance MÁS RECIENTE.
    // Agrupa los registros por tarea y se queda con el avance MÁS RECIENTE de cada una.
    const key = taskKey(d);
    const t = e.tasks[key] || { proyecto: d.proyecto||SIN_PROYECTO, actividad: d.actividad||"(sin definir)", pct:null, estado:null, fecha:null, _sortKey:"" };
    const sortKey = (d.fecha||"") + "T" + (d.createdAt||"");
    if(sortKey >= t._sortKey){
      t._sortKey = sortKey; t.fecha = d.fecha;
      if(typeof d.pct === "number") t.pct = d.pct;
      if(d.estado) t.estado = d.estado;
    }
    e.tasks[key] = t;
  });
  // Avance general = promedio SOLO de las tareas aún abiertas (en curso/pendiente/bloqueada).
  // Las tareas completadas NO se promedian con las demás: cuentan aparte como logro, así que
  // terminar una tarea nunca baja el número — en el peor de los casos simplemente sale del promedio.
  Object.values(byEng).forEach(e=>{
    const tasksArr = Object.values(e.tasks).sort((a,b)=> (b._sortKey||"").localeCompare(a._sortKey||""));
    e.taskList = tasksArr;
    const completadas = tasksArr.filter(t=>t.estado==="Completada");
    const abiertas = tasksArr.filter(t=>t.estado!=="Completada");
    const abiertasConPct = abiertas.filter(t=>t.pct!=null);
    e.completedCount = completadas.length;
    e.openCount = abiertas.length;
    if(abiertasConPct.length){
      e.lastPct = Math.round(abiertasConPct.reduce((s,t)=>s+t.pct,0)/abiertasConPct.length);
    } else if(completadas.length){
      e.lastPct = 100; // todo lo que tenía abierto este mes ya quedó completado
    } else {
      e.lastPct = null;
    }
  });
  return {byEng, weeks};
}

// Pestaña 'Resumen general': tarjeta por ingeniero con horas, avance y botones de informes.
function renderResumen(){
  const {byEng, weeks} = computeStats();
  const cards = engineersList.map((eng)=>{
    const e = byEng[eng.name];
    const avg = e.lastPct;
    const diasSin = e.last ? Math.round((new Date(todayStr()) - new Date(e.last))/86400000) : null;
    let estado = "Sin registros", color="var(--bad)";
    if(e.n>0){
      if(avg===null) { estado="Sin datos"; color="var(--sub)"; }
      else if(avg>=80){ estado="Buen ritmo"; color="var(--ok)"; }
      else if(avg>=40){ estado="En progreso"; color="var(--warn)"; }
      else { estado="Rezagado"; color="var(--bad)"; }
    }
    const alerta = diasSin!==null && diasSin>5 ? ` · <span style="color:var(--bad)">${diasSin} días sin actualizar</span>` : "";
    const estKey = slugify(eng.name);
    const estVal = estimates[estKey]!=null ? estimates[estKey] : "";
    const estWeeklyNum = estimates[estKey]!=null ? Number(estimates[estKey]) : null;
    const estMes = estWeeklyNum!=null ? (estWeeklyNum*weeks).toFixed(1) : null;
    const diff = estMes!=null ? (e.horas - estMes).toFixed(1) : null;
    return `<div class="sumcard">
      <div class="sumtop">
        <div class="sumtop-left">
          <div class="sname">${eng.name}</div>
          <div class="smeta">${e.n} registros · ${e.horas.toFixed(1)} h trabajadas${e.horasExtra>0?` (${e.horasExtra.toFixed(1)} extra)`:""} · última: ${e.last||"—"}${alerta}</div>
          ${e.horasAusencia>0?`<div class="smeta">${Object.keys(e.horasPorTipo).filter(t=>AUSENCIA_TYPES.includes(t)).map(t=>`${t}: ${e.horasPorTipo[t].toFixed(1)} h`).join(" · ")}</div>`:""}
          ${estMes!=null?`<div class="smeta">Estimado del mes: ${estMes} h · Diferencia: ${diff>=0?"+":""}${diff} h</div>`:""}
        </div>
        <div class="sumtop-right">
          <div class="spct" style="color:${color}">${avg!==null?avg+"%":"—"}</div>
          <div class="smeta" style="color:${color}">${estado}</div>
          <div class="smeta">${e.openCount>0 ? `${e.openCount} en curso` : "sin tareas abiertas"}</div>
          ${e.completedCount>0 ? `<div class="smeta" style="color:var(--ok)">✓ ${e.completedCount} completada(s)</div>` : ""}
        </div>
      </div>
      ${e.taskList.length ? `<div class="tasklist">${e.taskList.map(t=>
          `<div class="taskrow"><span>${t.proyecto} · ${t.actividad}</span><span><span class="badge ${badgeClass(t.estado)}">${t.estado||""}</span> ${t.pct!=null?t.pct+"%":"—"}</span></div>`
        ).join("")}</div>` : ""}
      <div class="estrow">Horas estimadas/semana: <input type="number" min="0" step="0.5" class="est_input" data-eng="${estKey}" value="${estVal}" placeholder="ej. 40"></div>
    </div>`;
  }).join("");
  return `
  <div class="card">${cards || '<div class="empty">Sin ingenieros configurados.</div>'}</div>
  <div class="msg ${formMsgType}" id="msgbox2" style="margin-top:-6px">${formMsg}</div>`;
}

// Muestra un mensaje al usuario en la caja de mensajes de la pestaña actual.
function showMsg(text, type){
  formMsg = text; formMsgType = type;
  const box = document.getElementById("msgbox") || document.getElementById("msgbox2") || document.getElementById("msgbox3") || document.getElementById("msgbox4");
  if(box){ box.textContent = text; box.className = "msg " + type; }
}

// ---------- 5. EVENTOS ----------
// Conecta cada botón y campo de la pantalla con su función. Se ejecuta después de cada render().
// Los botones con atributo data-act se envían todos a handleAction().
function wireEvents(){
  document.querySelectorAll(".tab[data-tab], .menu-item[data-tab]").forEach(t=>{
    // Al cambiar de pestaña se limpia el último mensaje para que no aparezca fuera de contexto
    t.onclick = ()=>{ view = t.dataset.tab; menuOpen = false; pendingConfirm = null; formMsg = ""; render(); if(view==="proyectos" || view==="informes") loadConsumoProyectos(); };
  });
  const btnMenu = document.getElementById("btn_menu");
  if(btnMenu) btnMenu.onclick = (e)=>{ e.stopPropagation(); menuOpen = !menuOpen; render(); };
  const btnDismissError = document.getElementById("btn_dismiss_error");
  if(btnDismissError) btnDismissError.onclick = ()=>{ globalError = ""; render(); };
  const btnAdminToggle = document.getElementById("btn_admin_toggle");
  if(btnAdminToggle) btnAdminToggle.onclick = ()=>{
    if(isOwner){ lockAdmin(); return; }
    adminLoginOpen = true; adminLoginError = ""; render();
  };
  const adminBackdrop = document.getElementById("admin_modal_backdrop");
  if(adminBackdrop) adminBackdrop.addEventListener("click", (e)=>{ if(e.target===adminBackdrop){ adminLoginOpen=false; render(); } });
  const btnAdminCancel = document.getElementById("btn_admin_cancel");
  if(btnAdminCancel) btnAdminCancel.onclick = ()=>{ adminLoginOpen=false; render(); };
  const btnAdminSubmit = document.getElementById("btn_admin_submit");
  if(btnAdminSubmit) btnAdminSubmit.onclick = ()=> submitAdminLogin();
  const adminEmailInput = document.getElementById("admin_email_input");
  if(adminEmailInput){ adminEmailInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") submitAdminLogin(); }); adminEmailInput.focus(); }
  const adminPassInput = document.getElementById("admin_pass_input");
  if(adminPassInput) adminPassInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") submitAdminLogin(); });
  const monthSel = document.getElementById("month_sel");
  if(monthSel) monthSel.onchange = (e)=>{
    selectedMonth = e.target.value;
    localStorage.setItem("ivan_sel_month", selectedMonth);
    subscribeMine(); subscribeAll(); render();
  };
  const engSel = document.getElementById("eng_select");
  if(engSel) engSel.onchange = (e)=>{
    selectedEngineer = e.target.value;
    localStorage.setItem("ivan_sel_eng", selectedEngineer);
    selectedTaskOption = "";
    subscribeMine(); subscribeOpenTasks(); render();
  };
  const form = document.getElementById("entry_form");
  if(form) form.onsubmit = onSubmit;
  const btnCancelEdit = document.getElementById("btn_cancel_edit");
  if(btnCancelEdit) btnCancelEdit.onclick = ()=>{
    editingId = null;
    render();
    const f = document.getElementById("f_fecha");
    if(f) f.value = todayStr();
  };
  const tipoSel = document.getElementById("f_tipo");
  if(tipoSel) tipoSel.onchange = (e)=>{
    selectedTipoHora = e.target.value;
    render();
    const horasEl = document.getElementById("f_horas");
    if(horasEl && AUSENCIA_TYPES.includes(selectedTipoHora) && !horasEl.value){ horasEl.value = MAX_HORAS; }
  };
  // required dinámico: los campos de trabajo no son obligatorios si el tipo de hora es una ausencia
  const isWork = !AUSENCIA_TYPES.includes(selectedTipoHora);
  ["f_estado","f_actividad","f_detalle","f_pct"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.required = isWork;
  });
  const taskSel = document.getElementById("f_task");
  if(taskSel) taskSel.onchange = (e)=>{
    selectedTaskOption = e.target.value;
    const actEl = document.getElementById("f_actividad");
    const detEl = document.getElementById("f_detalle");
    const proyEl = document.getElementById("f_proyecto");
    const estEl = document.getElementById("f_estado");
    const pctEl = document.getElementById("f_pct");
    if(selectedTaskOption){
      const t = openTasksList.find(x=>x.taskId===selectedTaskOption);
      if(t){
        if(actEl) actEl.value = t.actividad||"";
        if(detEl) detEl.value = t.detalle||"";
        if(proyEl) proyEl.value = t.proyecto||"";
        if(estEl) estEl.value = (t.estado==="Bloqueada") ? "En curso" : (t.estado||"");
        if(pctEl) pctEl.value = t.pct!=null?t.pct:"";
      }
    } else {
      if(actEl) actEl.value = ""; if(detEl) detEl.value = ""; if(proyEl) proyEl.value = "";
      if(estEl) estEl.value = ""; if(pctEl) pctEl.value = "";
    }
  };
  const estSel = document.getElementById("f_estado");
  if(estSel) estSel.addEventListener("change", (e)=>{
    if(e.target.value === "Completada"){
      const pctEl = document.getElementById("f_pct");
      if(pctEl && !pctEl.value) pctEl.value = 100;
    }
  });

  document.querySelectorAll("[data-act]").forEach(b=>{
    b.onclick = ()=>handleAction(b.dataset.act, b.dataset);
  });

  const btnWord = document.getElementById("btn_download_word");
  if(btnWord) btnWord.onclick = downloadWordReport;
  const btnXlsx = document.getElementById("btn_download_xlsx");
  if(btnXlsx) btnXlsx.onclick = downloadExcelMes;

  document.querySelectorAll(".est_input").forEach(inp=>{
    inp.onchange = async (e)=>{
      if(!db) return;
      const key = e.target.dataset.eng;
      const val = Number(e.target.value)||0;
      try{ await db.doc("config/estimates").set({...estimates, [key]: val}); }
      catch(err){ showMsg("No se pudo guardar el estimado: "+(err.message||err.code), "bad"); }
    };
  });

  const btnAddEng = document.getElementById("btn_add_eng");
  if(btnAddEng) btnAddEng.onclick = addEngineer;
  const projBuscaEl = document.getElementById("proj_busca");
  if(projBuscaEl) projBuscaEl.oninput = (e)=>{
    // Filtra en pantalla sin redibujar, para no perder el cursor mientras se escribe
    projBusca = e.target.value;
    const q = projBusca.trim().toLowerCase();
    let n = 0;
    document.querySelectorAll("tr.prow").forEach(tr=>{ const ok = !q || tr.dataset.search.includes(q); tr.style.display = ok ? "" : "none"; if(ok) n++; });
    const c = document.getElementById("proj_count"); if(c) c.textContent = `${n} proyecto(s)`;
  };
  const projFEst = document.getElementById("proj_f_estado");
  if(projFEst) projFEst.onchange = (e)=>{ projFiltroEstado = e.target.value; render(); };
  const projFTipo = document.getElementById("proj_f_tipo");
  if(projFTipo) projFTipo.onchange = (e)=>{ projFiltroTipo = e.target.value; render(); };
  const pfTipo = document.getElementById("pf_tipo");
  const pfCodigo = document.getElementById("pf_codigo");
  if(pfCodigo) pfCodigo.oninput = ()=>{ pfCodigo.dataset.auto = "0"; };
  if(pfTipo && pfCodigo && projSel==="__new__") pfTipo.onchange = ()=>{ if(pfCodigo.dataset.auto==="1") pfCodigo.value = nextCodigo(pfTipo.value); };
  document.querySelectorAll(".orden_estado").forEach(sel=>{
    sel.onchange = ()=> updateOrdenEstado(sel.dataset.proj, sel.dataset.orden, sel.value);
  });

  const btnCbWord = document.getElementById("btn_cb_word");
  if(btnCbWord) btnCbWord.onclick = downloadCompBonosReport;
  document.querySelectorAll("details[data-fold]").forEach(el=>{
    el.addEventListener("toggle", ()=>{ if(el.open) openFolds.add(el.dataset.fold); else openFolds.delete(el.dataset.fold); });
  });
}

// Ejecuta la acción de cada botón según su data-act (editar, eliminar, abrir proyecto, marcar pagado…).
// ds trae los demás atributos data-* del botón (id, ingeniero, fecha…).
async function handleAction(act, ds){
  if(act === "cancel-confirm"){ pendingConfirm = null; render(); return; }

  if(act === "ask-del-activity"){ pendingConfirm = {type:"activity", key: ds.id}; render(); return; }
  if(act === "confirm-del-activity"){
    pendingConfirm = null;
    try{ await db.doc("activities/"+ds.id).delete(); showMsg("Registro eliminado.", "ok"); }
    catch(err){ showMsg("No se pudo eliminar: " + (err.message||err.code), "bad"); render(); }
    return;
  }
  if(act === "edit-activity"){
    const d = myEntries.find(e=>e._id===ds.id);
    if(!d) return;
    editingId = ds.id;
    selectedTipoHora = d.tipoHora || "Normal";
    render();
    document.getElementById("f_fecha").value = d.fecha||"";
    document.getElementById("f_tipo").value = selectedTipoHora;
    document.getElementById("f_actividad").value = AUSENCIA_TYPES.includes(selectedTipoHora) ? "" : (d.actividad||"");
    document.getElementById("f_detalle").value = AUSENCIA_TYPES.includes(selectedTipoHora) ? "" : (d.detalle||"");
    document.getElementById("f_proyecto").value = AUSENCIA_TYPES.includes(selectedTipoHora) ? "" : (d.proyecto||"");
    document.getElementById("f_estado").value = d.estado||"";
    document.getElementById("f_pct").value = d.pct!=null?d.pct:"";
    document.getElementById("f_horas").value = d.horas!=null?d.horas:"";
    document.getElementById("f_obs").value = d.obs||"";
    const extraSubEl = document.getElementById("f_extra_sub");
    if(extraSubEl) extraSubEl.value = d.extraTipo || "Trabajo normal";
    document.getElementById("entry_form").scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }

  if(act === "cb-open"){
    if(ds.tab==="comp") compSel = (compSel===ds.eng) ? "" : ds.eng;
    else bonoSel = (bonoSel===ds.eng) ? "" : ds.eng;
    formMsg = ""; render();
    const el = document.getElementById("cb_detalle"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  if(act === "cb-trat"){ await cbSaveTratamiento(ds.id, ds.v); return; }
  if(act === "cb-dom-pago"){ await cbToggleDomPago(ds.id); return; }
  if(act === "cb-bono-pago"){ await cbToggleBono(ds.eng, ds.fecha); return; }
  if(act === "cb-saldo-pago"){ await cbToggleSaldoPago(ds.eng, ds.kind); return; }
  if(act === "cb-save-saldo"){ await cbSaveSaldo(ds.eng, ds.kind); return; }

  if(act === "save-engineer"){ await trySaveEngineer(Number(ds.i)); return; }
  if(act === "ask-del-engineer"){ pendingConfirm = {type:"deleteEngineer", key: Number(ds.i)}; render(); return; }
  if(act === "confirm-del-engineer"){ await doDeleteEngineer(Number(ds.i)); return; }
  if(act === "confirm-rename"){ await doRenameEngineer(Number(ds.i)); return; }

  if(act === "proj-open"){
    if(projSel !== ds.id){ projSel = ds.id; editingOrden = null; pendingConfirm = null; formMsg = ""; const p = projectsList.find(x=>x.id===ds.id); if(p) loadProjHoras(p); }
    render();
    const el = document.getElementById("proj_detalle"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  if(act === "costos-save"){ await saveCostos(); return; }
  if(act === "gasto-save"){ await saveGasto(ds.proj); return; }
  if(act === "ask-del-gasto"){ pendingConfirm = {type:"deleteGasto", key: ds.id}; render(); return; }
  if(act === "confirm-del-gasto"){ await deleteGasto(ds.id); return; }
  if(act === "inf-consumo"){ await loadConsumoProyectos(true); return; }
  if(act === "inf-proj"){ view = "proyectos"; projSel = ds.id; editingOrden = null; pendingConfirm = null; formMsg = ""; render(); const pr = projectsList.find(x=>x.id===ds.id); if(pr && !projHoras[pr.id]) loadProjHoras(pr); const el = document.getElementById("proj_detalle"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(act === "proj-new"){ projSel = "__new__"; editingOrden = null; pendingConfirm = null; formMsg = ""; render(); const el = document.getElementById("proj_detalle"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(act === "proj-close"){ projSel = ""; editingOrden = null; pendingConfirm = null; render(); return; }
  if(act === "proj-save"){ await saveProject(); return; }
  if(act === "ask-del-proj"){ pendingConfirm = {type:"deleteProj", key: ds.id}; render(); return; }
  if(act === "confirm-del-proj"){ await deleteProject(ds.id); return; }
  if(act === "proj-horas"){ const p = projectsList.find(x=>x.id===ds.id); if(p){ projHoras[p.id] = {loading:true}; render(); await loadProjHoras(p); } return; }
  if(act === "orden-save"){ await saveOrden(ds.proj); return; }
  if(act === "orden-edit"){ editingOrden = { proj: ds.proj, id: ds.orden }; pendingConfirm = null; render(); const el = document.getElementById("of_numero"); if(el) el.focus(); return; }
  if(act === "orden-cancel"){ editingOrden = null; render(); return; }
  if(act === "ask-del-orden"){ pendingConfirm = {type:"deleteOrden", key: ds.orden}; render(); return; }
  if(act === "confirm-del-orden"){ await deleteOrden(ds.proj, ds.orden); return; }
}

// ---------- 6. REGISTRO DIARIO ----------
// Valida y guarda (o actualiza) un registro del formulario en la colección 'activities'.
async function onSubmit(ev){
  ev.preventDefault();
  if(!db){ showMsg("Conectando con el almacenamiento, intenta de nuevo en unos segundos.", "bad"); return; }
  const fecha = document.getElementById("f_fecha").value;
  const tipoHora = document.getElementById("f_tipo").value || "Normal";
  // Trabajo (Normal/Extra) pide actividad, proyecto y avance; las ausencias no.
  const isWork = !AUSENCIA_TYPES.includes(tipoHora);
  const horas = Number(document.getElementById("f_horas").value);
  const obs = document.getElementById("f_obs").value.trim();
  let extraTipo = null;
  if(tipoHora==="Extra"){
    const extraSubEl = document.getElementById("f_extra_sub");
    extraTipo = extraSubEl ? extraSubEl.value : "Trabajo normal";
  }

  let actividad, detalle, proyecto, estado, pct;
  if(isWork){
    actividad = document.getElementById("f_actividad").value;
    detalle = document.getElementById("f_detalle").value.trim();
    proyecto = document.getElementById("f_proyecto").value.trim() || SIN_PROYECTO;
    estado = document.getElementById("f_estado").value;
    pct = Number(document.getElementById("f_pct").value);
    if(!fecha || !actividad || !detalle || !estado){ showMsg("Completa todos los campos obligatorios.", "bad"); return; }
    if(isNaN(pct) || pct<0 || pct>100){ showMsg("El % de avance debe estar entre 0 y 100.", "bad"); return; }
  } else {
    actividad = tipoHora; // así "Vacaciones", "Incapacidad", etc. aparecen agrupadas en los reportes
    detalle = obs || tipoHora;
    proyecto = SIN_PROYECTO;
    estado = null; pct = null;
    if(!fecha){ showMsg("Selecciona la fecha.", "bad"); return; }
  }
  // Tope de horas por día para este tipo de hora.
  const cap = TIPO_MAX[tipoHora] ?? MAX_HORAS;
  if(isNaN(horas) || horas<0 || horas>cap){ showMsg(`Las horas de tipo "${tipoHora}" deben estar entre 0 y ${cap}.`, "bad"); return; }

  try{
    // Suma lo que el ingeniero ya registró ese día con el mismo tipo de hora, para no pasar el tope.
    const snap = await db.collection("activities")
      .where("engineer","==",selectedEngineer).where("fecha","==",fecha).get();
    const yaRegistradas = snap.docs
      .filter(d=> d.id !== editingId && (d.data().tipoHora||"Normal") === tipoHora)
      .reduce((s,d)=> s + (typeof d.data().horas==="number"?d.data().horas:0), 0);
    if(yaRegistradas + horas > cap + 0.001){
      showMsg(`La suma de horas tipo "${tipoHora}" para ${fecha} supera ${cap} h (ya tienes ${yaRegistradas.toFixed(1)} h registradas ese día).`, "bad");
      return;
    }
    if(editingId){
      await db.doc("activities/"+editingId).update({
        engineer: selectedEngineer, fecha, tipoHora, actividad, detalle, proyecto, estado, pct, horas, obs, extraTipo
        // taskId no se toca al editar: un registro pasado siempre sigue perteneciendo a la misma tarea
      });
      showMsg("Registro actualizado correctamente.", "ok");
      editingId = null;
    } else {
      // Registro nuevo: continúa la tarea elegida o crea una tarea nueva.
      const taskId = isWork ? (selectedTaskOption || newTaskId()) : null;
      await db.collection("activities").add({
        engineer: selectedEngineer, fecha, tipoHora, actividad, detalle, proyecto, estado, pct, horas, obs, taskId, extraTipo,
        createdAt: new Date().toISOString()
      });
      showMsg("Registro guardado correctamente.", "ok");
      selectedTaskOption = "";
    }
    // Limpia el formulario y vuelve a la fecha de hoy.
    ev.target.reset();
    document.getElementById("f_fecha").value = todayStr();
    selectedTipoHora = "Normal";
    render();
  }catch(err){
    showMsg("No se pudo guardar: " + (err.message || err.code), "bad");
  }
}

// ---------- Equipo: cada ingeniero es un documento independiente en config_engineers/<slug> ----------
// Guarda cambios de un ingeniero; si cambió el nombre, pide confirmación antes de renombrar.
async function trySaveEngineer(i){
  const eng = engineersList[i];
  const nameInput = document.querySelector(`.eq_name[data-i="${i}"]`);
  const cargoInput = document.querySelector(`.eq_cargo[data-i="${i}"]`);
  const newName = nameInput.value.trim();
  const newCargo = cargoInput.value.trim();
  if(!newName){ showMsg("El nombre no puede quedar vacío.", "bad"); return; }
  const newId = slugify(newName);
  if(newId !== eng.id){
    pendingConfirm = { type:"renameEngineer", key:i, name:newName, cargo:newCargo, oldName:eng.name, oldId:eng.id, newId };
    render();
    return;
  }
  try{
    await db.doc("config_engineers/"+eng.id).set({ name:newName, cargo:newCargo });
    showMsg("Ingeniero actualizado.", "ok");
  }catch(err){
    showMsg("No se pudo guardar (recuerda: solo los administradores pueden editar el equipo). " + (err.message||err.code), "bad");
  }
}

// Renombra un ingeniero y actualiza el nombre en todos sus registros históricos.
async function doRenameEngineer(i){
  const { name:newName, cargo:newCargo, oldName, oldId, newId } = pendingConfirm;
  pendingConfirm = null;
  try{
    const snap = await db.collection("activities").where("engineer","==",oldName).get();
    for(const d of snap.docs){ await db.doc("activities/"+d.id).update({ engineer: newName }); }
    await db.doc("config_engineers/"+newId).set({ name:newName, cargo:newCargo });
    if(newId !== oldId){ await db.doc("config_engineers/"+oldId).delete(); }
    if(selectedEngineer === oldName) selectedEngineer = newName;
    showMsg("Ingeniero renombrado y registros históricos actualizados.", "ok");
  }catch(err){
    showMsg("No se pudo renombrar: " + (err.message||err.code), "bad");
    render();
  }
}

// Quita un ingeniero de la lista activa (sus registros históricos se conservan).
async function doDeleteEngineer(i){
  pendingConfirm = null;
  const eng = engineersList[i];
  try{ await db.doc("config_engineers/"+eng.id).delete(); showMsg("Ingeniero eliminado de la lista activa.", "ok"); }
  catch(err){ showMsg("No se pudo eliminar: " + (err.message||err.code), "bad"); render(); }
}



// Agrega un ingeniero nuevo a config_engineers.
async function addEngineer(){
  const name = document.getElementById("new_eng_name").value.trim();
  const cargo = document.getElementById("new_eng_cargo").value.trim() || "Ingeniero de Proyectos";
  if(!name){ showMsg("Escribe un nombre.", "bad"); return; }
  const id = slugify(name);
  try{
    const existing = await db.doc("config_engineers/"+id).get();
    if(existing.exists){ showMsg("Ese nombre ya existe.", "bad"); return; }
    await db.doc("config_engineers/"+id).set({ name, cargo });
    showMsg("Ingeniero agregado.", "ok");
    const ni = document.getElementById("new_eng_name"); if(ni) ni.value = "";
  }catch(err){
    showMsg("No se pudo agregar: " + (err.message||err.code), "bad");
  }
}

// ---------- Proyectos y servicios: un documento por proyecto en config_projects/<codigo> ----------
// Campos: codigo, tipo, cliente, anio, nombre (corto, el que ven los ingenieros), objeto, docTipo, documento (OC/OS/contrato),
//         estado, fechaInicio, fechaFin, notas, ordenes[] (órdenes de contratos a solicitud del cliente), duplicado, importado.
const TIPOS_PROY = ["Proyecto","Servicio","Interno"];
const TIPO_PROY_DESC = { Proyecto:"3xxx", Servicio:"20xx", Interno:"0xxx · capacitaciones y demos" };
const ESTADOS_PROY = ["Por ejecutar","En ejecución","Pendiente","Bloqueado","Contrato vigente","Ejecutado pendiente de pago","Cerrado"];
const ESTADOS_PROY_DESC = {
  "Por ejecutar":"Aprobado, aún no inicia",
  "En ejecución":"Se está ejecutando",
  "Pendiente":"En espera de cliente, información o aprobación",
  "Bloqueado":"Detenido por un impedimento",
  "Contrato vigente":"Contrato abierto: se ejecuta con órdenes a solicitud del cliente",
  "Ejecutado pendiente de pago":"Terminado, falta el pago",
  "Cerrado":"Terminado y pagado"
};
// Solo estos estados aparecen en la lista de proyectos de los ingenieros
const ESTADOS_PROY_ACTIVOS = ["Por ejecutar","En ejecución","Pendiente","Bloqueado","Contrato vigente"];
const ESTADO_PROY_BADGE = {"Por ejecutar":"b-pend","En ejecución":"b-curso","Pendiente":"b-pend","Bloqueado":"b-bloq","Contrato vigente":"b-comp","Ejecutado pendiente de pago":"b-extra","Cerrado":"b-gris"};
const DOC_TIPOS = ["OC","OS","Contrato","Otro"];
const ESTADOS_ORDEN = ["Solicitada","Programada","En ejecución","Ejecutada pendiente de pago","Cerrada","Cancelada"];
const ORDEN_ABIERTA = ["Solicitada","Programada","En ejecución"];
const DIAS_AVISO_VENCIMIENTO = 60;

// Estado de un proyecto; los creados antes del rediseño (sin estado) cuentan como 'En ejecución'.
function estadoProy(p){ return p.estado || "En ejecución"; } // proyectos creados antes del rediseño siguen activos
// Tipo de proyecto; si no lo tiene guardado, lo deduce del primer dígito del código.
function tipoProy(p){
  if(p.tipo) return p.tipo;
  const c = String(p.codigo||"");
  return c.startsWith("3") ? "Proyecto" : c.startsWith("0") ? "Interno" : "Servicio";
}
// true si el proyecto debe aparecer en la lista de los ingenieros.
function proyActivo(p){ return ESTADOS_PROY_ACTIVOS.includes(estadoProy(p)); }
// Siguiente número libre según el tipo: Proyecto 3xxx, Servicio 20xx, Interno 0xxx.
function nextCodigo(tipo){
  const re = tipo==="Proyecto" ? /^3\d{3}$/ : tipo==="Servicio" ? /^20\d{2}$/ : /^0\d{3}$/;
  const base = tipo==="Proyecto" ? 3000 : tipo==="Servicio" ? 2000 : 0;
  const nums = projectsList.map(p=>String(p.codigo||"").trim()).filter(c=>re.test(c)).map(Number);
  return String((nums.length ? Math.max(...nums) : base) + 1).padStart(4,"0");
}
// Días que faltan desde hoy hasta una fecha (negativo si ya pasó). Se usa para el aviso de vencimiento.
function diasHasta(fecha){
  if(!fecha) return null;
  const [y,m,d] = fecha.split("-").map(Number), [ty,tm,td] = todayStr().split("-").map(Number);
  return Math.round((Date.UTC(y,m-1,d) - Date.UTC(ty,tm-1,td)) / 86400000);
}
// Texto del documento del proyecto (OC/OS/Contrato + número) sin repetir el tipo.
function docLabel(p){
  const doc = String(p.documento||"").trim(), t = p.docTipo||"";
  if(!doc) return t || "—";
  return t && !doc.toUpperCase().startsWith(t.toUpperCase()) ? `${t} ${doc}` : doc;
}
// Órdenes del contrato que todavía no se han ejecutado (Solicitada, Programada o En ejecución).
function ordenesAbiertas(p){ return (p.ordenes||[]).filter(o=>ORDEN_ABIERTA.includes(o.estado)); }
// Arma las opciones <option> de un desplegable marcando la seleccionada.
function selOpts(list, val){ return list.map(x=>`<option value="${escH(x)}" ${x===val?"selected":""}>${escH(x)}</option>`).join(""); }

// Pestaña 'Proyectos' (admin): avisos, buscador, filtros y la lista de proyectos.
// Si hay un proyecto abierto, su detalle se dibuja encima de la lista.
function renderProyectos(){
  const vencen = projectsList.filter(p=>estadoProy(p)==="Contrato vigente" && p.fechaFin && diasHasta(p.fechaFin)<=DIAS_AVISO_VENCIMIENTO)
    .sort((a,b)=>a.fechaFin.localeCompare(b.fechaFin));
  const nOrdAb = projectsList.reduce((a,p)=>a+ordenesAbiertas(p).length, 0);
  const pendPago = projectsList.filter(p=>estadoProy(p)==="Ejecutado pendiente de pago" || (p.ordenes||[]).some(o=>o.estado==="Ejecutada pendiente de pago"));
  const nActivos = projectsList.filter(proyActivo).length;

  // Aplica los filtros de estado y tipo, y ordena por código de mayor a menor.
  let list = projectsList.slice();
  if(projFiltroEstado==="activos") list = list.filter(proyActivo);
  else if(projFiltroEstado!=="todos") list = list.filter(p=>estadoProy(p)===projFiltroEstado);
  if(projFiltroTipo!=="todos") list = list.filter(p=>tipoProy(p)===projFiltroTipo);
  list.sort((a,b)=> String(b.codigo).localeCompare(String(a.codigo), "es", {numeric:true}));
  const q = projBusca.trim().toLowerCase();
  const rows = list.map(p=>{
    const search = [p.codigo,p.cliente,p.nombre,p.documento,p.objeto].join(" ").toLowerCase();
    const est = estadoProy(p);
    const oa = ordenesAbiertas(p).length;
    const vence = est==="Contrato vigente" && p.fechaFin ? diasHasta(p.fechaFin) : null;
    return `<tr class="prow ${p.id===projSel?"psel":""}" data-act="proj-open" data-id="${escH(p.id)}" data-search="${escH(search)}" ${q && !search.includes(q) ? 'style="display:none"' : ""}>
      <td data-label="Código"><b>${escH(p.codigo)}</b>${p.duplicado?` <span class="badge b-bloq" title="Código repetido en la base anterior">dup</span>`:""}</td>
      <td data-label="Cliente">${escH(p.cliente||"—")}</td>
      <td data-label="Nombre">${escH(p.nombre||"—")}${oa?`<div class="hint" style="color:var(--primary)">${oa} orden(es) abierta(s)</div>`:""}${vence!=null && vence<=DIAS_AVISO_VENCIMIENTO?`<div class="hint" style="color:var(--bad)">${vence<0?"Venció":"Vence en "+vence+" días"}</div>`:""}</td>
      <td data-label="Estado"><span class="badge ${ESTADO_PROY_BADGE[est]||"b-curso"}">${escH(est)}</span></td>
      <td data-label="Consumo">${presupuestoHoras(p) ? consumoBadge(p) : "—"}</td>
      <td data-label="OC / OS">${escH(docLabel(p))}</td>
      <td data-label="Año">${p.anio||"—"}</td>
    </tr>`;
  }).join("");

  const estadoFiltroOpts = [["activos",`Activos (${nActivos})`],["todos",`Todos (${projectsList.length})`]]
    .concat(ESTADOS_PROY.map(e=>[e, `${e} (${projectsList.filter(p=>estadoProy(p)===e).length})`]))
    .map(([v,l])=>`<option value="${escH(v)}" ${v===projFiltroEstado?"selected":""}>${escH(l)}</option>`).join("");
  const tipoFiltroOpts = [["todos","Todos los tipos"]].concat(TIPOS_PROY.map(t=>[t,t]))
    .map(([v,l])=>`<option value="${v}" ${v===projFiltroTipo?"selected":""}>${l}</option>`).join("");

  // Avisos: contratos por vencer, pendientes de pago y órdenes abiertas.
  const alertas = [];
  if(vencen.length) alertas.push(`<div class="palert bad"><b>Contratos por vencer:</b> ${vencen.map(p=>`<a data-act="proj-open" data-id="${escH(p.id)}">${escH(p.codigo)} ${escH(p.cliente||"")}</a> (${diasHasta(p.fechaFin)<0?"vencido":diasHasta(p.fechaFin)+" días"})`).join(" · ")}</div>`);
  const sobre = projectsList.filter(p=>{ const c = consumoDe(p); return c && (c.nivel==="bad" || c.nivel==="warn"); });
  if(sobre.length) alertas.push(`<div class="palert ${sobre.some(p=>consumoDe(p).nivel==="bad")?"bad":"warn"}"><b>Consumo de horas:</b> ${sobre.map(p=>{ const c = consumoDe(p); return `<a data-act="proj-open" data-id="${escH(p.id)}">${escH(p.codigo)} ${escH(p.cliente||"")}</a> (${Math.round(c.pct)} %)`; }).join(" · ")}</div>`);
  if(pendPago.length) alertas.push(`<div class="palert warn"><b>Pendientes de pago:</b> ${pendPago.map(p=>`<a data-act="proj-open" data-id="${escH(p.id)}">${escH(p.codigo)} ${escH(p.cliente||"")}</a>`).join(" · ")}</div>`);
  if(nOrdAb) alertas.push(`<div class="palert info"><b>${nOrdAb} orden(es) abierta(s)</b> en contratos vigentes.</div>`);

  const detalle = projSel ? renderProjDetalle() : "";
  return `${detalle}
  <div class="card">
    <div class="admin-note">Registro de proyectos y servicios. La numeración es automática por tipo: <b>3xxx</b> Proyectos · <b>20xx</b> Servicios · <b>0xxx</b> Internos (capacitaciones y demos). Los ingenieros solo ven en su lista los proyectos <b>Por ejecutar, En ejecución, Pendientes, Bloqueados</b> y <b>Contratos vigentes</b>. Toca un proyecto para ver su detalle, sus órdenes y las horas registradas.</div>
    ${alertas.join("")}
    <div class="ptools">
      <input id="proj_busca" placeholder="Buscar código, cliente, nombre u OC…" value="${escH(projBusca)}">
      <select id="proj_f_estado">${estadoFiltroOpts}</select>
      <select id="proj_f_tipo">${tipoFiltroOpts}</select>
      <button class="primary" data-act="proj-new" style="margin-top:0;width:auto">+ Nuevo proyecto</button>
    </div>
    <div class="hint" id="proj_count" style="margin-bottom:6px">${list.length} proyecto(s)</div>
    ${rows ? cbTable(["Código","Cliente","Nombre","Estado","Consumo","OC / OS","Año"], rows) : `<div class="empty">No hay proyectos con este filtro.</div>`}
    <div class="msg ${formMsg?formMsgType:""}" id="msgbox3" style="margin-top:10px">${formMsg}</div>
  </div>`;
}

// Ficha de un proyecto (o del proyecto nuevo): formulario, órdenes y horas registradas.
function renderProjDetalle(){
  const isNew = projSel === "__new__";
  const p = isNew ? { tipo:"Proyecto", codigo: nextCodigo("Proyecto"), anio: Number(todayStr().slice(0,4)), estado:"Por ejecutar" } : projectsList.find(x=>x.id===projSel);
  if(!p) return "";
  const est = estadoProy(p);
  const clientes = [...new Set(projectsList.map(x=>x.cliente).filter(Boolean))].sort();
  const confirmingDel = pendingConfirm && pendingConfirm.type==="deleteProj" && pendingConfirm.key===p.id;
  const form = `
    <div class="row2">
      <div><label>Tipo</label><select id="pf_tipo" ${isNew?"":"disabled"}>${TIPOS_PROY.map(t=>`<option value="${t}" ${t===tipoProy(p)?"selected":""}>${t} (${TIPO_PROY_DESC[t]})</option>`).join("")}</select></div>
      <div><label>Número ${isNew?'<span class="hint">(automático, puedes cambiarlo)</span>':''}</label><input id="pf_codigo" value="${escH(p.codigo)}" data-auto="1" ${isNew?"":"disabled"}></div>
    </div>
    <div class="row2">
      <div><label>Cliente</label><input id="pf_cliente" list="pf_clientes" value="${escH(p.cliente||"")}" placeholder="Ej: ECOPETROL"><datalist id="pf_clientes">${clientes.map(c=>`<option value="${escH(c)}">`).join("")}</datalist></div>
      <div><label>Año</label><input type="number" id="pf_anio" value="${p.anio||""}" min="2000" max="2100"></div>
    </div>
    <label>Nombre corto <span class="hint">(lo que ven los ingenieros al registrar horas)</span></label>
    <input id="pf_nombre" value="${escH(p.nombre||"")}" placeholder="Ej: Hocol - Computadores de flujo">

        <div><label>Fecha programada de ejecución</label><input type="date" id="of_programada" value="${ed.fechaProgramada||""}"></div>

      <div class="row2">

// Tabla de horas registradas por cada ingeniero en el proyecto.

      + `<tr><td data-label="Total"><b>Total</b></td><td data-label="Horas"><b>${fmtN(h.total)} h</b></td><td data-label="Extra">${h.extra?fmtN(h.extra)+" h":"—"}</td><td data-label="Registros">${h.n}</td><td data-label=""></td><td data-label=""></td></tr>`);

    ${p.duplicado ? `<div class="hint" style="margin-bottom:6px">Código repetido: las horas registradas con el ${escH(p.codigo)} se muestran en ambos proyectos.</div>` : ""}

// Busca en 'activities' las horas cargadas al proyecto (por su código) y las agrupa por ingeniero.
async function loadProjHoras(p, silent){
  const cod = String(p.codigo||"").trim();
  if(!db || !cod) return;
  projHoras[p.id] = { loading:true };
  try{
    // Las horas guardan el proyecto como "código - nombre": se buscan por el código para no perderlas si cambia el nombre
    // Busca 'código - …' y también el código solo, para encontrar todas las horas del proyecto.
    const [a, b] = await Promise.all([
      db.collection("activities").where("proyecto", ">=", cod+" - ").where("proyecto", "<=", cod+" - ").limit(5000).get(),
      db.collection("activities").where("proyecto", "==", cod).limit(5000).get()
    ]);
    const by = {};
    let total = 0, extra = 0, n = 0;
    const regs = a.docs.concat(b.docs).map(d=>({ _id:d.id, ...d.data() }));
    regs.forEach(d=>{
      if(AUSENCIA_TYPES.includes(d.tipoHora)) return; // vacaciones, incapacidades, etc. no son horas del proyecto
      const h = Number(d.horas)||0;
      const r = by[d.engineer] || (by[d.engineer] = { engineer:d.engineer, horas:0, extra:0, n:0, desde:d.fecha||"", hasta:d.fecha||"" });
      r.horas += h; r.n++; total += h; n++;
      if(d.tipoHora==="Extra"){ r.extra += h; extra += h; }
      if(d.fecha && (!r.desde || d.fecha < r.desde)) r.desde = d.fecha;
      if(d.fecha && d.fecha > r.hasta) r.hasta = d.fecha;
    });
    projHoras[p.id] = { rows: Object.values(by).sort((x,y)=>y.horas-x.horas), total, extra, n, regs };
  }catch(err){
    projHoras[p.id] = { error: err.message||err.code };
  }
  if(!silent && view==="proyectos" && projSel===p.id) render();
}

// ---------- Fase 1 de indicadores: presupuesto de horas, consumo y utilización ----------
// % de consumo a partir del cual el proyecto pasa a amarillo; por encima de 100 % pasa a rojo.
const PRES_ALERTA_PCT = 80;
// Presupuesto de horas del proyecto. En contratos vigentes es la suma de sus órdenes (días × 8.5 h, sin las canceladas);
// en lo demás, lo que viene en la oferta, escrito en horas o en días.
function presupuestoHoras(p){
  if(estadoProy(p)==="Contrato vigente"){
    const h = (p.ordenes||[]).filter(o=>o.estado!=="Cancelada").reduce((a,o)=>a+(Number(o.dias)||0)*MAX_HORAS, 0);
    if(h > 0) return { horas:h, fuente:"órdenes" };
  }
  const v = Number(p.presupuestoValor)||0;
  if(v > 0) return { horas: p.presupuestoUnidad==="d" ? v*MAX_HORAS : v, fuente:"oferta" };
  return null;
}
// Consumo de horas contra presupuesto: null si no tiene presupuesto; {cargando} mientras llegan las horas.
function consumoDe(p){
  const pres = presupuestoHoras(p);
  if(!pres) return null;
  const h = projHoras[p.id];
  if(!h || h.loading) return { pres, cargando:true };
  if(h.error) return { pres, error:h.error };
  const pct = pres.horas > 0 ? h.total / pres.horas * 100 : 0;
  return { pres, horas:h.total, pct, disponible: pres.horas - h.total,
    nivel: pct > 100 ? "bad" : pct >= PRES_ALERTA_PCT ? "warn" : "ok" };
}
const NIVEL_TXT = { ok:"En presupuesto", warn:"Cerca del límite", bad:"Sobre presupuesto" };
const NIVEL_BADGE = { ok:"b-comp", warn:"b-pend", bad:"b-bloq" };
// Etiqueta corta del consumo para las tablas: "62 % · 74 / 120 h".
function consumoBadge(p){
  const c = consumoDe(p);
  if(!c) return `<span class="hint">Sin presupuesto</span>`;
  if(c.cargando) return `<span class="hint">Calculando…</span>`;
  if(c.error) return `<span class="hint">Sin datos</span>`;
  return `<span class="badge ${NIVEL_BADGE[c.nivel]}">${Math.round(c.pct)} %</span> <span class="hint">${fmtN(c.horas)} / ${fmtN(c.pres.horas)} h</span>`;
}
// Barra de consumo para el detalle del proyecto.
function consumoBarra(p){
  const c = consumoDe(p);
  if(!c) return `<div class="hint" style="margin-bottom:8px">Sin presupuesto de horas: escríbelo en el formulario para ver el consumo.</div>`;
  if(c.cargando || c.error) return "";
  const ancho = Math.min(100, c.pct);
  return `<div class="pcons">
      <div class="pcons-top"><b>Consumo: ${fmtN(c.horas)} de ${fmtN(c.pres.horas)} h (${Math.round(c.pct)} %)</b><span class="badge ${NIVEL_BADGE[c.nivel]}">${NIVEL_TXT[c.nivel]}</span></div>
      <div class="pbar"><div class="pbar-in ${c.nivel}" style="width:${ancho}%"></div></div>
      <div class="hint">${c.disponible >= 0 ? `Quedan ${fmtN(c.disponible)} h (${fmtN(c.disponible/MAX_HORAS)} días)` : `Se pasó por ${fmtN(-c.disponible)} h (${fmtN(-c.disponible/MAX_HORAS)} días)`} · Presupuesto ${c.pres.fuente==="órdenes" ? "= suma de las órdenes del contrato" : "de la oferta"}</div>
    </div>`;
}
// Carga las horas acumuladas de todos los proyectos con presupuesto (las que falten, o todas si force).
// Devuelve una promesa para que los informes puedan esperar a tener los datos.
let consumoPromise = null;
function loadConsumoProyectos(force){
  if(!db) return Promise.resolve();
  if(consumoPromise) return consumoPromise;
  const lista = projectsList.filter(p=>presupuestoHoras(p) && (force || !projHoras[p.id] || projHoras[p.id].error));
  if(!lista.length) return Promise.resolve();
  consumoPromise = Promise.all(lista.map(p=>loadProjHoras(p, true))).then(()=>{
    consumoPromise = null;
    if(view==="proyectos" || view==="informes") render();
  });
  return consumoPromise;
}
// Utilización del mes: horas en Proyectos y Servicios (se cobran al cliente) ÷ horas trabajadas.
// Capacitación y apoyo interno cuentan como horas no facturables. No incluye ausencias.
function utilizacionMes(r){
  const filas = r.porEng.map(e=>{
    const x = r.horasEngCat[e.name] || { total:0 };
    const fact = (x["Proyecto"]||0) + (x["Servicio"]||0);
    return { name:e.name, fact, noFact: x.total - fact, total: x.total, pct: x.total > 0 ? fact / x.total * 100 : null };
  });
  const fact = filas.reduce((a,f)=>a+f.fact, 0), total = filas.reduce((a,f)=>a+f.total, 0);
  return { filas, fact, noFact: total - fact, total, pct: total > 0 ? fact / total * 100 : null };
}
// Proyectos con presupuesto, ordenados del más consumido al menos consumido.
function proyectosConConsumo(){
  return projectsList.filter(p=>presupuestoHoras(p)).map(p=>({ p, c:consumoDe(p) }))
    .sort((a,b)=> ((b.c&&b.c.pct)||0) - ((a.c&&a.c.pct)||0));
}

// ---------- Fase 2: costo real de los proyectos (solo administradores) ----------
// Colecciones (solo admin): costos/config {factor, horasMes, recargoDominical, valorBono},
// costos/ing_<slug> {engineer, salario}, proyecto_gastos/<id> {proyId, codigo, fecha, categoria, concepto, valor}.
// Costo de la hora = salario mensual × factor prestacional ÷ horas laborales del mes.
// Horas normales y extra compensadas con tiempo: a costo de la hora. Extra de domingo/festivo pagada en dinero:
// costo de la hora + recargo. Bono de campo: valor por día en campo, repartido entre los proyectos de ese día.
const COSTOS_DEFAULT = { factor:1.52, horasMes:182, recargoDominical:115, valorBono:0 };
const CATEGORIAS_GASTO = ["Viáticos","Transporte","Hospedaje","Alimentación","Materiales y equipos","Subcontratos","Otros"];
function fmtCOP(v){ return (Number(v)||0).toLocaleString("es-CO", { style:"currency", currency:"COP", maximumFractionDigits:0 }); }
function costosParams(){ return { ...COSTOS_DEFAULT, ...(costosCfg||{}) }; }
// Código de proyecto de un texto "código - nombre" (o el texto completo si no empieza por código).
function codigoProyecto(label){ const t = String(label||"").trim(); const m = t.match(/^(\d[\w-]*)\s*(?:-\s|$)/); return m ? m[1] : t; }
function salarioDe(name){ const c = costosIng[slugify(name)]; return c && Number(c.salario) > 0 ? Number(c.salario) : null; }
// Costo de una hora del ingeniero, o null si no tiene salario registrado.
function costoHora(name){
  const s = salarioDe(name); if(s==null) return null;
  const cfg = costosParams();
  return cfg.horasMes > 0 ? s * cfg.factor / cfg.horasMes : null;
}
function hayCostos(){ return Object.keys(costosIng).some(k=>Number((costosIng[k]||{}).salario) > 0); }
// Costo de mano de obra de una lista de registros (sin ausencias).
function costoRegistros(regs){
  const cfg = costosParams();
  const r = { normal:0, extra:0, recargo:0, horasSinCosto:0, sinSalario:new Set(), porIng:{} };
  regs.forEach(d=>{
    const tipo = d.tipoHora || "Normal";
    if(AUSENCIA_TYPES.includes(tipo)) return;
    const h = Number(d.horas)||0; if(!h) return;
    const ch = costoHora(d.engineer);
    if(ch==null){ r.horasSinCosto += h; r.sinSalario.add(d.engineer); return; }
    const base = h * ch;
    // La extra de domingo/festivo pagada en dinero lleva recargo; la compensada con tiempo cuesta lo mismo que una hora normal
    const rec = tipo==="Extra" && tratamientoDe(d)==="Pago" ? base * cfg.recargoDominical / 100 : 0;
    if(tipo==="Extra") r.extra += base; else r.normal += base;
    r.recargo += rec;
    const pi = r.porIng[d.engineer] || (r.porIng[d.engineer] = { horas:0, costo:0 });
    pi.horas += h; pi.costo += base + rec;
  });
  r.manoObra = r.normal + r.extra + r.recargo;
  return r;
}
// Costo del bono de campo por código de proyecto, para los días en campo dentro del rango [desde, hasta].
function bonoPorCodigo(desde, hasta){
  const cfg = costosParams(), out = {};
  if(!(cfg.valorBono > 0) || !(compLoaded.comp && compLoaded.campo)) return out;
  Object.values(computeCompBonos()).forEach(r=>r.dias.forEach(x=>{
    if((desde && x.fecha < desde) || (hasta && x.fecha > hasta)) return;
    const cods = [...new Set([...x.proyectos].map(codigoProyecto))];
    if(!cods.length) return;
    cods.forEach(c=>{ out[c] = (out[c]||0) + cfg.valorBono / cods.length; });
  }));
  return out;
}
function gastosDe(p){ return gastos.filter(g=>g.proyId===p.id).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")); }
// Costo acumulado del proyecto: mano de obra + recargos + bono de campo + gastos.
function costoProyecto(p){
  const h = projHoras[p.id];
  if(!h || h.loading) return { cargando:true };
  if(h.error) return { error:h.error };
  const mo = costoRegistros(h.regs || []);
  const bono = bonoPorCodigo(null, null)[String(p.codigo||"").trim()] || 0;
  const gas = gastosDe(p).reduce((a,g)=>a+(Number(g.valor)||0), 0);
  return { mo, bono, gastos:gas, total: mo.manoObra + bono + gas };
}

  else {
    const ings = Object.entries(c.mo.porIng).sort((a,b)=>b[1].costo-a[1].costo);
    resumen = `<div class="kpis">
        <div class="kpi"><div class="kpi-l">Mano de obra</div><div class="kpi-v">${fmtCOP(c.mo.normal + c.mo.extra)}</div></div>

      <td data-label="Valor"><b>${fmtCOP(g.valor)}</b></td>
      <td data-label="">${confirming ? `<span class="confirmrow">¿Eliminar? <button class="tiny bad" data-act="confirm-del-gasto" data-id="${escH(g.id)}">Sí</button><button class="tiny" data-act="cancel-confirm">No</button></span>`
        : `<button class="tiny bad" data-act="ask-del-gasto" data-id="${escH(g.id)}">Eliminar</button>`}</td></tr>`;
  }).join("");
  const formGasto = `<div class="ordenform">
      <div class="hint" style="margin-bottom:6px"><b>Nuevo gasto</b> — viáticos, transporte, materiales, subcontratos…</div>
      <div class="row2">
        <div><label>Fecha</label><input type="date" id="gf_fecha" value="${todayStr()}"></div>
        <div><label>Categoría</label><select id="gf_cat">${selOpts(CATEGORIAS_GASTO, "Viáticos")}</select></div>
      </div>
      <div class="row2">
        <div><label>Concepto</label><input id="gf_concepto" placeholder="Ej: Tiquetes Bogotá - Yopal"></div>
        <div><label>Valor (COP)</label><input type="number" id="gf_valor" min="0" step="1" placeholder="Ej: 850000"></div>
      </div>
      <button class="primary" data-act="gasto-save" data-proj="${escH(p.id)}" style="margin-top:10px">Agregar gasto</button>
    </div>`;
  return `<h4 class="cbh">Costo del proyecto</h4>${resumen}
    <h4 class="cbh">Gastos del proyecto (${gs.length})</h4>

}
